<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
<div class="page-header">
  <h4><i class="bi bi-graph-up-arrow me-2 text-primary"></i>Forecast: <span th:text="${product.name}">Product</span></h4>
  <a th:href="@{/forecasting}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="card mb-3">
  <div class="card-body"><div class="chart-wrap tall"><canvas id="forecastChart"></canvas></div></div>
</div>
<div class="card">
  <div class="card-header">Forecast Data</div>
  <div class="card-body p-0">
    <table class="table table-sm mb-0">
      <thead><tr><th>Date</th><th>Predicted Demand</th><th>Lower</th><th>Upper</th></tr></thead>
      <tbody>
        <tr th:each="f : ${forecastResults}">
          <td th:text="${f.forecastDate}"></td>
          <td><strong th:text="${f.predictedDemand}"></strong></td>
          <td th:text="${f.confidenceLower}"></td>
          <td th:text="${f.confidenceUpper}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(forecastResults)}">
          <td colspan="4" class="text-center text-muted py-3">No forecast data. <a th:href="@{/forecasting}">Generate one.</a></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</th:block>
<th:block th:fragment="scripts">
<!-- Chart.js with CDN fallback chain (this page renders charts) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>if (typeof Chart === 'undefined') { document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>'); }</script>
<script>if (typeof Chart === 'undefined') { document.write('<script src="https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>'); }</script>

<script th:inline="javascript">
/*<![CDATA[*/
(function () {
  const results = /*[[${forecastResults}]]*/ [];

  function buildProductForecastChart() {
    if (typeof Chart === 'undefined') return;
    var ctx = document.getElementById('forecastChart');
    if (!ctx || !results || results.length === 0) return;
    var gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
    gradient.addColorStop(0, window.withAlpha(window.cssVar('--primary'), 0.28));
    gradient.addColorStop(1, window.withAlpha(window.cssVar('--primary'), 0));

    window.stocksenseCharts.productForecast = new Chart(ctx, {
      type: 'line',
      data: {
        labels: results.map(function (r) { return r.forecastDate; }),
        datasets: [{
          label: 'Predicted Demand',
          data: results.map(function (r) { return r.predictedDemand; }),
          borderColor: window.cssVar('--primary'),
          backgroundColor: gradient,
          fill: true,
          tension: 0.4,
          pointRadius: 3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: window.cssVar('--text-2'), boxWidth: 10, usePointStyle: true, pointStyle: 'circle' } },
          tooltip: { backgroundColor: window.cssVar('--surface'), titleColor: window.cssVar('--text'), bodyColor: window.cssVar('--text-2'), borderColor: window.cssVar('--border'), borderWidth: 1 }
        },
        scales: {
          y: { beginAtZero: true, grid: { color: window.withAlpha(window.cssVar('--text-3'), 0.15) }, ticks: { color: window.cssVar('--text-2') } },
          x: { grid: { display: false }, ticks: { color: window.cssVar('--text-2') } }
        }
      }
    });
  }

  if (typeof Chart !== 'undefined') {
    window.registerChartBuilder(buildProductForecastChart);
  }
})();
/*]]>*/
</script>
</th:block>
</html>
