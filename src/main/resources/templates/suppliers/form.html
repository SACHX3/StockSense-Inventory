<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-suppliers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
    <div>
      <h1 th:text="${supplierId != null ? 'Edit Supplier' : 'Add Supplier'}">Supplier Form</h1>
      <p th:text="${supplierId != null ? 'Update supplier record' : 'Create a new supplier record'}">Supplier record</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/suppliers}" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
  </div>
</div>

<form th:action="${supplierId != null ? '/suppliers/edit/' + supplierId : '/suppliers/create'}" method="post" class="panel">
  <div class="panel-head"><i class="bi bi-truck"></i><span>Supplier Information</span></div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="section-label"><i class="bi bi-info-circle"></i>Basic Information</div>

      <div class="field full">
        <label class="form-label">Company Name *</label>
        <input type="text" name="name" class="form-control" required th:value="${supplier.name}" placeholder="e.g. Ceylon Beverages Ltd"/>
      </div>

      <div class="field">
        <label class="form-label">Contact Person</label>
        <input type="text" name="contactPerson" class="form-control" th:value="${supplier.contactPerson}"/>
      </div>
      <div class="field">
        <label class="form-label">Phone *</label>
        <input type="text" name="phone" class="form-control" required th:value="${supplier.phone}" placeholder="+94 11 234 5678"/>
      </div>

      <div class="field">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" th:value="${supplier.email}"/>
      </div>
      <div class="field">
        <label class="form-label">Tax Number</label>
        <input type="text" name="taxNumber" class="form-control" th:value="${supplier.taxNumber}"/>
      </div>

      <div class="section-label"><i class="bi bi-info-circle"></i>Address</div>

      <div class="field full">
        <label class="form-label">Address</label>
        <textarea name="address" class="form-control" rows="2" th:text="${supplier.address}"></textarea>
      </div>

      <div class="field">
        <label class="form-label">City</label>
        <input type="text" name="city" class="form-control" th:value="${supplier.city}"/>
      </div>
      <div class="field">
        <label class="form-label">Country</label>
        <input type="text" name="country" class="form-control" th:value="${supplier.country ?: 'Sri Lanka'}"/>
      </div>

      <div class="section-label"><i class="bi bi-table"></i>Business Terms</div>

      <div class="field">
        <label class="form-label">Payment Terms</label>
        <select name="paymentTerms" class="form-select">
          <option value="">Select Terms</option>
          <option th:each="t : ${ {'IMMEDIATE','NET 7','NET 15','NET 30','NET 45','NET 60'}}"
                  th:value="${t}" th:text="${t}"
                  th:selected="${supplier.paymentTerms == t}">Terms</option>
        </select>
      </div>
      <div class="field full">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="2" th:text="${supplier.notes}"></textarea>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <a th:href="@{/suppliers}" class="btn-cancel">Cancel</a>
    <button type="submit" class="btn-save">
      <i class="bi bi-check-lg"></i>
      <span th:text="${supplierId != null ? 'Update Supplier' : 'Create Supplier'}">Save</span>
    </button>
  </div>
</form>

</th:block>
<th:block th:fragment="scripts">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.form-grid .field.full{grid-column:1 / -1}
.form-grid .field{margin-bottom:18px}
@media (max-width:700px){.form-grid{grid-template-columns:1fr}}

.section-label{font-size:12px;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 14px;grid-column:1/-1;display:flex;align-items:center;gap:7px}
.section-label i{font-size:14px}

.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:18px;border-top:1px solid var(--border);background:var(--surface-2)}
.btn-cancel{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:11px;padding:12px 22px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;transition:background .18s,transform .12s}
.btn-cancel:hover{background:var(--surface-2);transform:translateY(-1px)}
.btn-save{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border:0;border-radius:11px;padding:12px 24px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -6px rgba(91,63,201,.5);transition:filter .18s,transform .12s}
.btn-save:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-save i{font-size:15px}
@media (max-width:700px){.form-grid{grid-template-columns:1fr!important}}
</style>
</th:block>
</html>
