<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-suppliers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><path d="M16 8h4l3 3v5h-7V8Z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
    <div>
      <h1>Suppliers</h1>
      <p>Manage supplier records and vendor relationships</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/suppliers/create}" class="btn-primary" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
      <i class="bi bi-plus-lg"></i> Add Supplier
    </a>
  </div>
</div>

<form method="get" th:action="@{/suppliers}" class="filter-bar-panel">
  <div class="field search-field">
    <div class="search-wrap" id="slSearchBox" style="position:relative">
      <i class="bi bi-search"></i>
      <input type="text" name="keyword" id="slSearchInput" class="form-control" placeholder="Search by name or contact..." th:value="${keyword}" autocomplete="off"/>
      <div class="qs-dropdown" id="slQsDropdown"></div>
    </div>
  </div>
  <button type="submit" class="btn-primary"><i class="bi bi-search"></i> Search</button>
  <a th:href="@{/suppliers}" class="btn-ghost"><i class="bi bi-x"></i> Clear</a>
</form>

<div class="panel">
  <div style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>City</th><th>Payment Terms</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(suppliers)}"><td colspan="7" style="text-align:center;color:var(--text-3);padding:24px">No suppliers found.</td></tr>
        <tr th:each="s : ${suppliers}">
          <td>
            <div class="supplier-cell">
              <div class="supplier-avatar" th:text="${#strings.substring(s.name,0,1)}">N</div>
              <div>
                <div class="supplier-name" th:text="${s.name}">Name</div>
                <small class="supplier-sub" th:text="${s.email ?: ''}"></small>
              </div>
            </div>
          </td>
          <td th:text="${s.contactPerson ?: '-'}">Contact</td>
          <td th:text="${s.phone}">Phone</td>
          <td th:text="${s.city ?: '-'}">City</td>
          <td><span class="tag" th:text="${s.paymentTerms ?: '-'}">Terms</span></td>
          <td>
            <span class="badge active" th:if="${s.isActive}">Active</span>
            <span class="badge inactive" th:unless="${s.isActive}">Inactive</span>
          </td>
          <td>
            <div class="action-cell">
              <a th:href="@{'/suppliers/view/' + ${s.id}}" class="icon-btn view" title="View"><i class="bi bi-eye"></i></a>
              <a th:href="@{'/suppliers/edit/' + ${s.id}}" class="icon-btn edit" title="Edit" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')"><i class="bi bi-pencil"></i></a>
              <form th:action="@{'/suppliers/delete/' + ${s.id}}" method="post" style="display:inline"
                    sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Delete this supplier?')">
                <button type="submit" class="icon-btn del" title="Delete"><i class="bi bi-trash"></i></button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.filter-bar-panel{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.search-field{flex:1;min-width:220px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap i,.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;width:15px;height:15px;pointer-events:none}
.search-wrap input{width:100%;padding-left:36px}

.supplier-cell{display:flex;align-items:center;gap:10px}
.supplier-avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.supplier-name{font-weight:700;font-size:13px}
.supplier-sub{font-size:11px;color:var(--text-3);margin-top:1px}

.badge.active{background:var(--good-soft);color:var(--good)}
.badge.inactive{background:var(--bad-soft);color:var(--bad)}

.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s,color .15s,border-color .15s,transform .12s}
.icon-btn i,.icon-btn svg{width:14px;height:14px}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn.view:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.icon-btn.edit:hover{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.icon-btn.del:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.action-cell{display:flex;gap:6px}
</style>
<script>
(function () {
  var input = document.getElementById('slSearchInput');
  var box = document.getElementById('slSearchBox');
  var dropdown = document.getElementById('slQsDropdown');
  if (!input || !dropdown) return;

  var debounceTimer = null;
  var activeIndex = -1;
  var currentItems = [];
  var currentController = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function renderItems(suppliers, keyword) {
    currentItems = suppliers || [];
    activeIndex = -1;
    if (!currentItems.length) {
      dropdown.innerHTML = '<div class="qs-dropdown-empty">No suppliers match "' + escapeHtml(keyword) + '"</div>';
      dropdown.classList.add('open');
      return;
    }
    var html = currentItems.map(function (sp, i) {
      var initial = (sp.name || '?').charAt(0).toUpperCase();
      var statusClass = sp.active === false ? 'out' : 'ok';
      var statusLabel = sp.active === false ? 'Inactive' : 'Active';
      return '<a href="/suppliers/view/' + sp.id + '" class="qs-item" data-idx="' + i + '">' +
        '<span class="qs-item-thumb" style="background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;">' + escapeHtml(initial) + '</span>' +
        '<span class="qs-item-info">' +
          '<span class="qs-item-name">' + escapeHtml(sp.name) + '</span>' +
          '<span class="qs-item-meta">' + escapeHtml(sp.contactPerson || '') + ' &middot; ' + escapeHtml(sp.phone || '') + '</span>' +
        '</span>' +
        '<span class="qs-item-stock ' + statusClass + '">' + statusLabel + '</span>' +
      '</a>';
    }).join('');
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
  }
  function closeDropdown() {
    dropdown.classList.remove('open');
    dropdown.innerHTML = '';
    activeIndex = -1;
    currentItems = [];
  }
  function runSearch(keyword) {
    if (currentController) { try { currentController.abort(); } catch (e) {} }
    currentController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    box.classList.add('qs-loading');
    fetch('/suppliers/api/search?keyword=' + encodeURIComponent(keyword), {
      credentials: 'same-origin',
      signal: currentController ? currentController.signal : undefined
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        box.classList.remove('qs-loading');
        renderItems((res && res.data) || [], keyword);
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        box.classList.remove('qs-loading');
        dropdown.innerHTML = '<div class="qs-dropdown-empty">Search failed. Try again.</div>';
        dropdown.classList.add('open');
      });
  }
  input.addEventListener('input', function () {
    var v = input.value.trim();
    clearTimeout(debounceTimer);
    if (!v) { closeDropdown(); box.classList.remove('qs-loading'); return; }
    debounceTimer = setTimeout(function () { runSearch(v); }, 260);
  });
  input.addEventListener('keydown', function (e) {
    var items = dropdown.querySelectorAll('.qs-item');
    if (e.key === 'ArrowDown') {
      if (!items.length) return;
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach(function (el, i) { el.classList.toggle('qs-active', i === activeIndex); });
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach(function (el, i) { el.classList.toggle('qs-active', i === activeIndex); });
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0 && items[activeIndex]) {
        e.preventDefault();
        window.location.href = items[activeIndex].getAttribute('href');
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#slSearchBox') && !e.target.closest('#slQsDropdown')) closeDropdown();
  });
})();
</script>
</th:block>
</html>
