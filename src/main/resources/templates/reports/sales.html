<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
    <div>
      <h1>Sales Report</h1>
      <p>Transaction history and revenue analysis</p>
    </div>
  </div>
  <div class="head-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <a th:href="@{/reports}" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
    <a th:href="@{/reports/sales/export-csv(from=${from},to=${to},cashier=${cashier},paymentMethod=${paymentMethod},status=${status})}" class="btn-ghost" download><i class="bi bi-filetype-csv"></i> CSV</a>
    <a th:href="@{/reports/sales/export-pdf(from=${from},to=${to},cashier=${cashier},paymentMethod=${paymentMethod},status=${status})}" class="btn-primary" download><i class="bi bi-file-earmark-pdf"></i> Export PDF</a>
  </div>
</div>

<form method="get" th:action="@{/reports/sales}" class="filter-panel">
  <div class="filter-grid">
    <div class="filter-field"><label>From</label><input type="date" name="from" class="form-control" th:value="${from}"></div>
    <div class="filter-field"><label>To</label><input type="date" name="to" class="form-control" th:value="${to}"></div>
    <div class="filter-field">
      <label>Cashier</label>
      <select name="cashier" class="form-select">
        <option value="">All cashiers</option>
        <option th:each="c : ${cashierOptions}" th:value="${c}" th:text="${c}" th:selected="${c == cashier}"></option>
      </select>
    </div>
    <div class="filter-field">
      <label>Payment method</label>
      <select name="paymentMethod" class="form-select">
        <option value="">All methods</option>
        <option value="CASH" th:selected="${paymentMethod == 'CASH'}">Cash</option>
        <option value="CARD" th:selected="${paymentMethod == 'CARD'}">Card</option>
        <option value="BANK_TRANSFER" th:selected="${paymentMethod == 'BANK_TRANSFER'}">Bank Transfer</option>
        <option value="CREDIT" th:selected="${paymentMethod == 'CREDIT'}">Credit</option>
      </select>
    </div>
    <div class="filter-field">
      <label>Status</label>
      <select name="status" class="form-select">
        <option value="">All statuses</option>
        <option value="PAID" th:selected="${status == 'PAID'}">Paid</option>
        <option value="PENDING" th:selected="${status == 'PENDING'}">Pending</option>
        <option value="PARTIAL" th:selected="${status == 'PARTIAL'}">Partial</option>
      </select>
    </div>
  </div>
  <div class="filter-actions">
    <a th:href="@{/reports/sales}" class="btn-ghost">Reset</a>
    <button type="submit" class="btn-primary"><i class="bi bi-funnel"></i> Apply Filters</button>
  </div>
</form>

<div class="kpi-grid" style="margin-bottom:18px" id="salesKpis">
  <div class="kpi"><div class="kpi-value" th:text="${#lists.size(sales)}">0</div><div class="kpi-label">Total Sales</div></div>
  <div class="kpi"><div class="kpi-value" id="sRevenue" style="color:var(--good)">...</div><div class="kpi-label">Total Revenue</div></div>
  <div class="kpi"><div class="kpi-value" id="sDiscount" style="color:var(--warn)">...</div><div class="kpi-label">Total Discount</div></div>
  <div class="kpi"><div class="kpi-value" id="sAvg">...</div><div class="kpi-label">Average Sale</div></div>
</div>

<div class="panel">
  <div class="panel-head"><i class="bi bi-graph-up"></i><span>Revenue Trend</span></div>
  <div class="chart-wrap tall" style="padding:18px"><canvas id="salesTrendChart"></canvas></div>
</div>

<div class="panel">
  <div class="panel-head"><i class="bi bi-table"></i><span>Sales Transactions</span><span class="tag" th:text="${#lists.size(sales)} + ' records'"></span></div>
  <div style="overflow-x:auto">
    <table class="table" id="salesTable">
      <thead><tr><th>#</th><th>Invoice</th><th>Customer</th><th>Subtotal</th><th>Discount</th><th>Total</th><th>Payment</th><th>Cashier</th><th>Date</th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(sales)}"><td colspan="9" style="text-align:center;color:var(--text-3);padding:24px">No sales found for the selected filters.</td></tr>
        <tr th:each="s, i : ${sales}" th:data-total="${s.totalAmount}" th:data-disc="${s.discountAmount}" th:data-date="${#temporals.format(s.createdAt, 'dd MMM')}">
          <td th:text="${i.index + 1}"></td>
          <td><a th:href="@{'/sales/view/' + ${s.id}}"><code th:text="${s.invoiceNumber}"></code></a></td>
          <td th:text="${s.customerName ?: 'Walk-in Customer'}"></td>
          <td th:text="${'Rs. ' + #numbers.formatDecimal(s.subtotal != null ? s.subtotal : 0, 0, 'COMMA', 2, 'POINT')}"></td>
          <td th:text="${s.discountAmount != null and s.discountAmount.doubleValue() > 0 ? 'Rs. ' + #numbers.formatDecimal(s.discountAmount, 0, 'COMMA', 2, 'POINT') : '-'}"></td>
          <td style="font-weight:600;color:var(--good)" th:text="${'Rs. ' + #numbers.formatDecimal(s.totalAmount != null ? s.totalAmount : 0, 0, 'COMMA', 2, 'POINT')}"></td>
          <td><span class="tag" th:text="${s.paymentMethod}"></span></td>
          <td th:text="${s.cashierName ?: '-'}"></td>
          <td th:text="${#temporals.format(s.createdAt, 'dd MMM yyyy HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<!-- Chart.js with CDN fallback chain (this page renders charts) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>if (typeof Chart === 'undefined') { document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>'); }</script>
<script>if (typeof Chart === 'undefined') { document.write('<script src="https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js"><\/script>'); }</script>

<style>
.filter-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:14px}
.filter-field label{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.filter-actions{display:flex;gap:8px;justify-content:flex-end}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var rev = 0, disc = 0, cnt = 0;
  var labels = [], values = [];
  document.querySelectorAll('#salesTable tbody tr[data-total]').forEach(function (r) {
    var t = parseFloat(r.getAttribute('data-total')) || 0;
    rev += t;
    disc += parseFloat(r.getAttribute('data-disc')) || 0;
    cnt++;
    labels.unshift(r.getAttribute('data-date'));
    values.unshift(t);
  });
  var avg = cnt > 0 ? rev / cnt : 0;
  function rs(v) { return 'Rs. ' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function set(id, v) { var e = document.getElementById(id); if (e) e.textContent = v; }
  set('sRevenue', rs(rev)); set('sDiscount', rs(disc)); set('sAvg', rs(avg));

  if (typeof Chart !== 'undefined') {
    var ctx = document.getElementById('salesTrendChart');
    if (ctx) {
      var primary = window.cssVar('--primary'), text3 = window.cssVar('--text-3'), surface = window.cssVar('--surface'), text2 = window.cssVar('--text-2'), border = window.cssVar('--border');
      var g = ctx.getContext('2d').createLinearGradient(0, 0, 0, 220);
      g.addColorStop(0, window.withAlpha(primary, .26));
      g.addColorStop(1, window.withAlpha(primary, 0));
      new Chart(ctx, {
        type: 'line',
        data: { labels: labels, datasets: [{ label: 'Revenue (Rs.)', data: values, borderColor: primary, backgroundColor: g, fill: true, tension: .4, pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: primary, pointHoverBorderColor: surface, pointHoverBorderWidth: 2, borderWidth: 2.5 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: { duration: 800, easing: 'easeOutQuart' },
          plugins: { legend: { display: false }, tooltip: { backgroundColor: surface, titleColor: window.cssVar('--text'), bodyColor: text2, borderColor: border, borderWidth: 1, padding: 11, cornerRadius: 10, boxPadding: 4 } },
          scales: { x: { grid: { display: false }, ticks: { font: { size: 10.5 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } }, y: { grid: { color: window.withAlpha(text3, .12) }, ticks: { font: { size: 11 } }, border: { display: false } } }
        }
      });
    }
  }
});
</script>
</th:block>
</html>
