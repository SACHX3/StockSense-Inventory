<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z"/><path d="M3 9h18M9 21V9"/></svg></div>
    <div>
      <h1>Inventory Logs</h1>
      <p>Complete audit trail of every stock movement across all products</p>
    </div>
  </div>
  <div class="head-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <a th:href="@{/inventory/adjust}" class="btn-primary"><i class="bi bi-arrow-left-right"></i> Stock Adjustment</a>
  </div>
</div>

<div class="panel">
  <div style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th style="width:42px;">#</th>
          <th style="width:56px;"></th>
          <th>Product</th>
          <th>Type</th>
          <th>Qty Change</th>
          <th>Before</th>
          <th>After</th>
          <th>Reference</th>
          <th>User</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${logs.isEmpty()}">
          <td colspan="10" style="text-align:center;color:var(--text-3);padding:24px">No logs found.</td>
        </tr>
        <tr th:each="log : ${logs.content}">

          <!-- ID -->
          <td style="color:var(--text-3)" th:text="${log.id}"></td>

          <!-- Product image -->
          <td style="padding:7px 6px;vertical-align:middle;">
            <div style="width:42px;height:42px;border-radius:8px;overflow:hidden;
                        background:var(--surface-2);display:flex;align-items:center;
                        justify-content:center;border:1px solid var(--border);">
              <img th:if="${log.product.imagePath}"
                   th:src="@{'/' + ${log.product.imagePath}}"
                   style="width:42px;height:42px;object-fit:cover;"
                   onerror="this.parentElement.innerHTML='&lt;i class=&quot;bi bi-box&quot; style=&quot;color:var(--text-3);font-size:1rem;&quot;&gt;&lt;/i&gt;'"/>
              <i th:unless="${log.product.imagePath}"
                 class="bi bi-box" style="color:var(--text-3);font-size:1rem;"></i>
            </div>
          </td>

          <!-- Product name + SKU -->
          <td style="vertical-align:middle;">
            <div class="prod-name" th:text="${log.product.name}">Product</div>
            <div class="prod-sku" th:text="${log.product.sku}">SKU</div>
          </td>

          <!-- Movement type badge -->
          <td style="vertical-align:middle;">
            <span th:switch="${log.movementType.name()}">
              <span th:case="'STOCK_IN'"       class="badge-mv STOCK_IN">Stock In</span>
              <span th:case="'STOCK_OUT'"      class="badge-mv STOCK_OUT">Stock Out</span>
              <span th:case="'ADJUSTMENT'"     class="badge-mv ADJUSTMENT">Adjustment</span>
              <span th:case="'DAMAGED'"        class="badge-mv DAMAGED">Damaged</span>
              <span th:case="'RETURN'"         class="badge-mv RETURN">Return</span>
              <span th:case="'INVOICE_UPDATE'" class="badge-mv INVOICE_UPDATE">Invoice</span>
              <span th:case="*" class="badge-mv INVOICE_UPDATE" th:text="${log.movementType}">TYPE</span>
            </span>
          </td>

          <!-- Qty change -->
          <td style="vertical-align:middle;">
            <span th:class="${(log.movementType.name() == 'STOCK_OUT' or log.movementType.name() == 'DAMAGED') ? 'qty-change neg' : 'qty-change pos'}"
                  th:text="${(log.movementType.name() == 'STOCK_OUT' or log.movementType.name() == 'DAMAGED') ? '-' : '+'} + ${log.quantity}">+0</span>
          </td>

          <!-- Before / After -->
          <td style="color:var(--text-3)" th:text="${log.quantityBefore}">0</td>
          <td style="font-weight:600" th:text="${log.quantityAfter}">0</td>

          <!-- Reference -->
          <td style="vertical-align:middle;">
            <small style="color:var(--text-3)" th:text="${log.referenceNo ?: '-'}">Ref</small>
          </td>

          <!-- User -->
          <td style="vertical-align:middle;">
            <div class="user-cell">
              <div class="user-avatar" th:text="${log.user != null ? #strings.substring(log.user.username,0,1).toUpperCase() : 'S'}">U</div>
              <small th:text="${log.user != null ? log.user.username : 'system'}">user</small>
            </div>
          </td>

          <!-- Date -->
          <td style="vertical-align:middle;">
            <small th:text="${#temporals.format(log.createdAt, 'dd MMM yyyy HH:mm')}">date</small>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" style="justify-content:space-between"
       th:if="${logs.totalPages > 1}">
    <small style="color:var(--text-3)"
           th:text="'Page ' + (${logs.number} + 1) + ' of ' + ${logs.totalPages} + ' (' + ${logs.totalElements} + ' total)'"></small>
    <div class="page-controls">
      <a class="page-btn" th:classappend="${logs.first} ? 'disabled' : ''"
         th:href="@{/inventory(page=${logs.number - 1})}" aria-label="Previous page">&laquo;</a>
      <a th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
         th:if="${i >= logs.number - 2 and i <= logs.number + 2}"
         class="page-btn" th:classappend="${i == logs.number} ? 'active' : ''"
         th:href="@{/inventory(page=${i})}" th:text="${i + 1}">1</a>
      <a class="page-btn" th:classappend="${logs.last} ? 'disabled' : ''"
         th:href="@{/inventory(page=${logs.number + 1})}" aria-label="Next page">&raquo;</a>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.badge-mv{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.badge-mv.STOCK_IN{background:var(--good-soft);color:var(--good)}
.badge-mv.STOCK_OUT{background:var(--primary-soft);color:var(--primary)}
.badge-mv.ADJUSTMENT{background:color-mix(in srgb, var(--primary-2, var(--primary)) 18%, transparent);color:var(--primary-2, var(--primary))}
.badge-mv.DAMAGED{background:var(--bad-soft);color:var(--bad)}
.badge-mv.RETURN{background:var(--warn-soft);color:var(--warn)}
.badge-mv.INVOICE_UPDATE{background:var(--surface-2);color:var(--text-3)}

.qty-change{font-weight:700;font-size:12.5px}
.qty-change.pos{color:var(--good)}
.qty-change.neg{color:var(--bad)}
.prod-name{font-weight:700;font-size:12.5px}
.prod-sku{color:var(--text-3);font-size:11px;margin-top:1px}
.user-cell{display:flex;align-items:center;gap:7px}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex:none}

.pagination{display:flex;align-items:center;padding:15px 18px;border-top:1px solid var(--border);background:var(--surface-2)}
.page-controls{display:flex;gap:5px;align-items:center}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:8px;min-width:30px;height:30px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;transition:background .18s,color .18s,border-color .18s}
.page-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.page-btn.active{background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border-color:transparent}
.page-btn.disabled{opacity:.45;pointer-events:none}
</style>
</th:block>
</html>
