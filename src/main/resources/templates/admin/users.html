<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
    <div>
      <h1>Users &amp; Roles</h1>
      <p>Manage staff accounts, roles, and access</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/users/create}" class="btn-primary"><i class="bi bi-plus-lg"></i> Add User</a>
  </div>
</div>

<div class="filter-bar-panel">
  <div class="field search-field">
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" class="form-control" placeholder="Search by name, username, or email..." autocomplete="off">
    </div>
  </div>
  <div class="select-wrap">
    <select id="roleFilter" class="form-select">
      <option value="">All Roles</option>
      <option value="ROLE_ADMIN">Admin</option>
      <option value="ROLE_INVENTORY_MANAGER">Inventory Manager</option>
      <option value="ROLE_STAFF">Staff</option>
    </select>
  </div>
  <div class="select-wrap">
    <select id="statusFilter" class="form-select">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>
</div>

<div class="result-count" id="resultCount" th:text="'Showing ' + ${#lists.size(users)} + ' of ' + ${#lists.size(users)} + ' users'">Showing users</div>

<div class="panel">
  <div class="panel-body" style="padding:0">
    <div style="overflow-x:auto">
      <table class="table" id="usersTable">
        <thead>
          <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Last Login</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}"
              th:data-name="${u.fullName}" th:data-username="${u.username}" th:data-email="${u.email}"
              th:data-role="${u.role.name}" th:data-active="${u.isActive}">
            <td>
              <div class="user-cell">
                <div class="avatar-circle" th:text="${#strings.toUpperCase(#strings.substring(u.fullName,0,1))}">N</div>
                <div>
                  <div class="user-name" th:text="${u.fullName}">Name</div>
                  <div class="user-sub" th:text="'@' + ${u.username} + ' · ' + ${u.email}">@user · email</div>
                </div>
              </div>
            </td>
            <td>
              <span th:switch="${u.role.name}">
                <span th:case="'ROLE_ADMIN'" class="role-badge admin">Admin</span>
                <span th:case="'ROLE_INVENTORY_MANAGER'" class="role-badge manager">Inventory Manager</span>
                <span th:case="'ROLE_STAFF'" class="role-badge staff">Staff</span>
                <span th:case="*" class="role-badge staff" th:text="${u.role.name}">Role</span>
              </span>
            </td>
            <td>
              <span th:classappend="${u.isActive} ? 'active-badge on' : 'active-badge off'"
                    th:text="${u.isActive} ? 'Active' : 'Inactive'">Status</span>
            </td>
            <td><span th:text="${u.lastLogin != null ? #temporals.format(u.lastLogin, 'dd MMM yy HH:mm') : 'Never'}">Never</span></td>
            <td>
              <div class="row-actions">
                <a th:href="@{'/users/edit/' + ${u.id}}" class="icon-btn edit" title="Edit user"><i class="bi bi-pencil"></i></a>
                <form th:action="@{'/users/toggle/' + ${u.id}}" method="post" style="display:inline;">
                  <button type="submit" class="icon-btn deactivate"
                          th:title="${u.isActive} ? 'Deactivate user' : 'Activate user'">
                    <i th:classappend="${u.isActive} ? 'bi bi-pause-circle' : 'bi bi-play-circle'"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px">No users found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.filter-bar-panel{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.search-field{flex:1;min-width:220px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap i,.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;width:15px;height:15px;pointer-events:none}
.search-wrap input{width:100%;padding-left:36px}
.filter-bar-panel .select-wrap{width:190px}
.result-count{font-size:12px;color:var(--text-3);margin-bottom:12px}
.avatar-circle{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex:none;background:linear-gradient(135deg,var(--primary),var(--primary-2))}
.user-cell{display:flex;align-items:center;gap:11px}
.user-name{font-weight:700;font-size:12.5px}
.user-sub{font-size:11.5px;color:var(--text-3);margin-top:1px}
.role-badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block;letter-spacing:.01em}
.role-badge.admin{background:var(--primary-soft);color:var(--primary)}
.role-badge.manager{background:#e3edff;color:#2f5fd6}
:root[data-theme="dark"] .role-badge.manager, :root:not([data-theme="light"]) .role-badge.manager{background:rgba(90,140,255,.16);color:#8ab0ff}
.role-badge.staff{background:var(--surface-2);color:var(--text-2)}
.active-badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.active-badge.on{background:var(--good-soft);color:var(--good)}
.active-badge.off{background:var(--bad-soft);color:var(--bad)}
.active-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.icon-btn{width:32px;height:32px;border-radius:9px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;transition:background .18s,color .18s,border-color .18s,transform .12s}
.icon-btn:hover{transform:translateY(-1px)}
.icon-btn.edit:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.icon-btn.deactivate:hover{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.row-actions{display:flex;gap:7px;justify-content:flex-end}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('#usersTable tbody tr[data-name]'));
  var total = rows.length;
  var searchInput = document.getElementById('searchInput');
  var roleFilter = document.getElementById('roleFilter');
  var statusFilter = document.getElementById('statusFilter');
  var resultCount = document.getElementById('resultCount');

  function applyFilters() {
    var q = (searchInput.value || '').trim().toLowerCase();
    var role = roleFilter.value;
    var status = statusFilter.value;
    var visible = 0;
    rows.forEach(function (r) {
      var name = (r.getAttribute('data-name') || '').toLowerCase();
      var username = (r.getAttribute('data-username') || '').toLowerCase();
      var email = (r.getAttribute('data-email') || '').toLowerCase();
      var rRole = r.getAttribute('data-role') || '';
      var rActive = r.getAttribute('data-active') === 'true';
      var matchesQ = !q || name.indexOf(q) !== -1 || username.indexOf(q) !== -1 || email.indexOf(q) !== -1;
      var matchesRole = !role || rRole === role;
      var matchesStatus = !status || (status === 'active' ? rActive : !rActive);
      var show = matchesQ && matchesRole && matchesStatus;
      r.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    if (resultCount) resultCount.textContent = 'Showing ' + visible + ' of ' + total + ' users';
  }

  if (searchInput) searchInput.addEventListener('input', applyFilters);
  if (roleFilter) roleFilter.addEventListener('change', applyFilters);
  if (statusFilter) statusFilter.addEventListener('change', applyFilters);
});
</script>
</th:block>
</html>
