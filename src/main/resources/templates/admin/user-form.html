<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></div>
    <div>
      <h1 th:text="${userId != null ? 'Edit User' : 'Add User'}">User Form</h1>
      <p th:text="${userId != null ? 'Update account details and role for this user' : 'Create a new staff account and assign a role'}">Manage user</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/users}" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back to Users</a>
  </div>
</div>

<div class="panel" style="max-width:760px">
  <div class="panel-head"><i class="bi bi-people"></i><span>User Details</span></div>
  <div class="panel-body">
    <form th:action="${userId != null ? '/users/edit/' + userId : '/users/create'}" method="post">

      <div class="form-grid">
        <div class="field">
          <label>Full Name *</label>
          <input type="text" name="fullName" required th:value="${user.fullName}" placeholder="e.g. Nadeesha Perera"/>
        </div>
        <div class="field">
          <label>Username *</label>
          <input type="text" name="username" required th:value="${user.username}" placeholder="e.g. nadeesha.p"/>
        </div>
        <div class="field">
          <label>Email *</label>
          <input type="email" name="email" required th:value="${user.email}" placeholder="name@stocksense.io"/>
        </div>
        <div class="field">
          <label>Phone</label>
          <input type="text" name="phone" th:value="${user.phone}" placeholder="+94 71 234 5678"/>
        </div>
        <div class="field">
          <label th:text="${userId != null ? 'Password (leave blank to keep current)' : 'Password *'}">Password</label>
          <input type="password" name="password" th:required="${userId == null}" minlength="6" placeholder="Minimum 6 characters"/>
        </div>
      </div>

      <div class="notice-box" th:if="${userId != null}">
        <i class="bi bi-info-circle"></i>
        <div>Leave the password field blank to keep the user's current password. Only fill it in if you want to reset it.</div>
      </div>

      <div class="field" style="max-width:340px">
        <label>Role *</label>
        <div class="select-wrap">
          <select name="roleId" class="form-select" required>
            <option value="">Select Role</option>
            <option th:each="r : ${roles}" th:value="${r.id}"
                    th:text="${r.name == 'ROLE_ADMIN' ? 'Administrator' : (r.name == 'ROLE_INVENTORY_MANAGER' ? 'Inventory Manager' : 'Staff')}"
                    th:selected="${user.roleId == r.id}">Role</option>
          </select>
        </div>
        <div class="hint">
          <strong>Admin:</strong> Full access | <strong>Manager:</strong> Inventory &amp; products | <strong>Staff:</strong> Sales only
        </div>
      </div>

      <div class="form-actions">
        <a th:href="@{/users}" class="btn-ghost">Cancel</a>
        <button type="submit" class="btn-primary-sm">
          <i class="bi bi-check-lg"></i>
          <span th:text="${userId != null ? 'Update User' : 'Create User'}">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.form-grid{grid-template-columns:1fr}}
.field{margin-bottom:18px}
.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.field input[type=text],.field input[type=email],.field input[type=tel],.field input[type=password]{width:100%;background:var(--surface-2);border:1.5px solid var(--border);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--text)}
.field input:hover{border-color:color-mix(in srgb, var(--primary) 35%, var(--border))}
.field input:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.field .hint{font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.5}
.select-wrap{position:relative}
.select-wrap select{width:100%;appearance:none;background:var(--surface-2);border:1.5px solid var(--border);border-radius:11px;padding:11px 36px 11px 13px;font-size:13px;color:var(--text)}
.select-wrap select:focus{outline:none;border-color:var(--primary);background:var(--surface)}
.notice-box{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb, var(--warn) 30%, var(--border));border-radius:11px;padding:12px 14px;margin-bottom:20px;font-size:12px;color:var(--text-2);line-height:1.5}
.notice-box i{color:var(--warn);flex:none;margin-top:1px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:6px}
.btn-primary-sm{background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border:0;border-radius:11px;padding:11px 22px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -6px rgba(91,63,201,.5);display:inline-flex;align-items:center;gap:6px;transition:filter .18s,transform .12s}
.btn-primary-sm:hover{filter:brightness(1.1);transform:translateY(-1px)}
@media (max-width:700px){.form-grid{grid-template-columns:1fr!important}}
</style>
</th:block>
</html>
