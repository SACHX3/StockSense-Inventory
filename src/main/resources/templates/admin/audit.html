<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M9 12h6M12 9v6"/></svg></div>
    <div>
      <h1>Audit Log</h1>
      <p>Track user actions and system changes across StockSense</p>
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-body">
    <div class="result-count" th:text="${logs.totalElements} + ' total logs'">total logs</div>
    <div style="overflow-x:auto">
      <table class="table" id="auditTable">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Action</th>
            <th>Entity</th>
            <th>Details</th>
            <th>IP Address</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="log : ${logs.content}">
            <td th:text="${#temporals.format(log.createdAt, 'dd MMM yy HH:mm')}"></td>
            <td class="mono" th:text="${log.username ?: 'system'}"></td>
            <td>
              <span class="action-badge"
                    th:classappend="${#strings.contains(log.action,'CREATED')} ? 'create' : (${#strings.contains(log.action,'DELETED')} ? 'delete' : (${#strings.contains(log.action,'LOGIN')} or ${#strings.contains(log.action,'LOGOUT')} ? 'auth' : 'update'))"
                    th:text="${log.action}">ACTION</span>
            </td>
            <td class="entity-cell" th:text="${log.entityType ?: '-'}"></td>
            <td class="dim" th:text="${log.newValues != null and log.newValues.length() > 60 ? log.newValues.substring(0,60) + '...' : (log.newValues ?: '-')}"></td>
            <td class="mono" th:text="${log.ipAddress ?: '-'}"></td>
          </tr>
          <tr th:if="${logs.isEmpty()}"><td colspan="6" style="text-align:center;color:var(--text-3);padding:24px">No audit logs found.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="panel-foot" style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--border)" th:if="${logs.totalPages > 1}">
    <span class="dim" th:text="${logs.totalElements} + ' total logs'"></span>
    <div style="display:flex;gap:8px">
      <a class="btn-ghost" th:classappend="${logs.first} ? 'disabled' : ''" th:href="@{/audit(page=${logs.number - 1})}">« Prev</a>
      <a class="btn-ghost" th:classappend="${logs.last} ? 'disabled' : ''" th:href="@{/audit(page=${logs.number + 1})}">Next »</a>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.result-count{font-size:12px;color:var(--text-3);margin-bottom:12px}
.mono{font-family:'SFMono-Regular',Consolas,monospace;font-size:11.5px;color:var(--text-2)}
.entity-cell{font-weight:600}
.dim{color:var(--text-3)}
.action-badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:6px;letter-spacing:.02em;display:inline-block;font-family:'SFMono-Regular',Consolas,monospace}
.action-badge.create{background:var(--good-soft);color:var(--good)}
.action-badge.update{background:var(--warn-soft);color:var(--warn)}
.action-badge.delete{background:var(--bad-soft);color:var(--bad)}
.action-badge.auth{background:var(--primary-soft);color:var(--primary)}
.btn-ghost.disabled{opacity:.4;pointer-events:none}
</style>
</th:block>
</html>
