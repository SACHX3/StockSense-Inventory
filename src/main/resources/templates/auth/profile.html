<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    <div>
      <h1>My Profile</h1>
      <p>Manage your account photo and details</p>
    </div>
  </div>
</div>

<div class="profile-grid">
  <!-- LEFT column -->
  <div>
    <div class="panel">
      <div class="avatar-card">
        <div class="avatar-big-wrap">
          <div class="avatar-big">
            <img th:if="${user != null and user.avatarPath != null}" th:src="@{'/'+${user.avatarPath}}" alt="Profile photo"/>
            <span th:unless="${user != null and user.avatarPath != null}"
                  th:text="${user != null ? #strings.toUpperCase(#strings.substring(user.fullName,0,1)) : 'U'}">A</span>
          </div>
          <button type="button" class="camera-btn" title="Change photo" onclick="document.getElementById('avatarInput').click();">
            <i class="bi bi-camera"></i>
          </button>
        </div>

        <h3 th:text="${user?.fullName ?: 'User'}">Name</h3>
        <div class="uname" th:text="'@' + ${user?.username}">@user</div>

        <form th:action="@{/profile/avatar}" method="post" enctype="multipart/form-data" id="avatarForm">
          <input type="file" id="avatarInput" name="avatar" accept="image/png,image/jpeg,image/jpg,image/gif,image/webp" style="display:none;" onchange="document.getElementById('avatarForm').submit();"/>
          <button type="button" class="btn-ghost change-photo-btn" onclick="document.getElementById('avatarInput').click();">
            <i class="bi bi-upload"></i> Upload photo
          </button>
        </form>
        <p class="hint">JPG, PNG, GIF or WEBP. Max 10MB.</p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><i class="bi bi-shield-check"></i><span>Account Status</span></div>
      <div class="panel-body" style="padding-top:6px;padding-bottom:6px">
        <div class="meta-row" th:if="${user != null}">
          <i class="bi bi-shield-check"></i>
          <div>
            <div class="mlabel">Role</div>
            <div class="mval">
              <span class="tag" th:if="${user != null}"
                    th:classappend="${user.role != null and user.role.name == 'ROLE_ADMIN'} ? 'out' : (${user.role != null and user.role.name == 'ROLE_INVENTORY_MANAGER'} ? 'low' : '')"
                    th:text="${user.role != null ? #strings.replace(#strings.replace(user.role.name,'ROLE_',''),'_',' ') : 'Staff'}">Role</span>
            </div>
          </div>
        </div>
        <div class="meta-row">
          <i class="bi bi-check-circle"></i>
          <div>
            <div class="mlabel">Status</div>
            <div class="mval"><span class="active-badge">Active</span></div>
          </div>
        </div>
        <div class="meta-row" th:if="${user?.phone}">
          <i class="bi bi-clock"></i>
          <div>
            <div class="mlabel">Phone</div>
            <div class="mval" th:text="${user.phone}">-</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT column -->
  <div>
    <div class="panel">
      <div class="panel-head">
        <div class="title-wrap">
          <span>Account details</span>
          <span class="subtitle">Read-only — contact an admin to change these</span>
        </div>
      </div>
      <div class="panel-body">
        <table class="table">
          <tbody>
            <tr><td style="color:var(--text-3);width:140px;">Full name</td><td th:text="${user?.fullName ?: '-'}">-</td></tr>
            <tr><td style="color:var(--text-3);">Username</td><td th:text="${user?.username ?: '-'}">-</td></tr>
            <tr><td style="color:var(--text-3);">Email</td><td th:text="${user?.email ?: '-'}">-</td></tr>
            <tr><td style="color:var(--text-3);">Phone</td><td th:text="${user?.phone ?: '-'}">-</td></tr>
            <tr><td style="color:var(--text-3);">Status</td><td><span class="tag low">Active</span></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.profile-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media (max-width:900px){.profile-grid{grid-template-columns:1fr}}

.avatar-card{text-align:center;padding:26px 18px}
.avatar-big-wrap{position:relative;width:104px;height:104px;margin:0 auto 16px}
.avatar-big{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;overflow:hidden;border:3px solid var(--surface);box-shadow:var(--shadow)}
.avatar-big img{width:100%;height:100%;object-fit:cover}
.camera-btn{position:absolute;bottom:0;right:0;width:32px;height:32px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--surface);transition:transform .15s,filter .15s;cursor:pointer}
.camera-btn:hover{transform:scale(1.08);filter:brightness(1.1)}
.camera-btn i{font-size:14px}
.avatar-card h3{margin:0 0 3px;font-size:16px;letter-spacing:-.01em}
.avatar-card .uname{font-size:12px;color:var(--text-3);margin-bottom:14px}
.change-photo-btn{width:100%;justify-content:center}
.avatar-card .hint{margin:8px 0 0;color:var(--text-3);font-size:.72rem}

.meta-row{display:flex;align-items:center;gap:10px;padding:10px 0;text-align:left}
.meta-row + .meta-row{border-top:1px solid var(--border)}
.meta-row i{color:var(--text-3);flex:none;font-size:15px}
.meta-row .mlabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.meta-row .mval{font-size:12.5px;font-weight:700;margin-top:1px}
.active-badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;background:var(--good-soft);color:var(--good)}
.active-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
@media (max-width:800px){.profile-grid{grid-template-columns:1fr!important}}
</style>
</th:block>
</html>
