<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>
    <div>
      <h1 th:text="${productId != null ? 'Edit Product' : 'Add Product'}">Product Form</h1>
      <p th:text="${productId != null ? 'Update this product''s details' : 'Create a new product in your inventory catalog'}">Create a new product</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/products}" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back to Products</a>
  </div>
</div>

<form th:action="${productId != null ? '/products/edit/' + productId : '/products/create'}"
      method="post" enctype="multipart/form-data">

  <div class="grid" style="display:grid;grid-template-columns:1fr 320px;gap:20px">
    <div class="panel">
      <div class="panel-head"><i class="bi bi-box-seam"></i><span>Product Details</span></div>
      <div class="panel-body" style="padding:18px">
        <div class="form-grid">
          <div class="field full">
            <label>Product Name *</label>
            <input type="text" name="name" class="form-control" required th:value="${product.name}" placeholder="e.g. Basmati Rice 5kg"/>
          </div>
          <div class="field">
            <label>SKU *</label>
            <input type="text" name="sku" class="form-control" required th:value="${product.sku}" placeholder="e.g. GRN-BAS-5KG"/>
            <div class="hint">Must be unique across all products</div>
          </div>
          <div class="field">
            <label>Barcode</label>
            <input type="text" name="barcode" class="form-control" th:value="${product.barcode}" placeholder="Scan or enter barcode"/>
          </div>
          <div class="field full">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="2" th:text="${product.description}" placeholder="Optional product description"></textarea>
          </div>
          <div class="field">
            <label>Category *</label>
            <select name="categoryId" class="form-select" required>
              <option value="">Select Category</option>
              <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                      th:selected="${product.categoryId == cat.id}">Category</option>
            </select>
          </div>
          <div class="field">
            <label>Supplier</label>
            <select name="supplierId" class="form-select">
              <option value="">No Supplier</option>
              <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"
                      th:selected="${product.supplierId == s.id}">Supplier</option>
            </select>
          </div>
          <div class="field">
            <label>Unit *</label>
            <select name="unit" class="form-select">
              <option th:each="u : ${ {'pcs','kg','g','l','ml','box','pack','bottle','can','bag','bar','loaf','tin'}}"
                      th:value="${u}" th:text="${u}"
                      th:selected="${product.unit == u}">pcs</option>
            </select>
          </div>
          <div class="field">
            <label>Buying Price (Rs.) *</label>
            <div class="price-prefix"><span>Rs</span><input type="number" step="0.01" min="0" name="buyingPrice" class="form-control" required th:value="${product.buyingPrice}" placeholder="0.00"/></div>
          </div>
          <div class="field">
            <label>Selling Price (Rs.) *</label>
            <div class="price-prefix"><span>Rs</span><input type="number" step="0.01" min="0.01" name="sellingPrice" class="form-control" required th:value="${product.sellingPrice}" placeholder="0.00"/></div>
          </div>
          <div class="field">
            <label>Current Quantity *</label>
            <input type="number" min="0" name="quantity" class="form-control" required th:value="${product.quantity}" placeholder="0"/>
          </div>
          <div class="field">
            <label>Min Stock Level</label>
            <input type="number" min="0" name="minStockLevel" class="form-control" th:value="${product.minStockLevel != null ? product.minStockLevel : 10}"/>
          </div>
          <div class="field">
            <label>Max Stock Level</label>
            <input type="number" min="0" name="maxStockLevel" class="form-control" th:value="${product.maxStockLevel != null ? product.maxStockLevel : 1000}"/>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <div class="panel-head"><i class="bi bi-image"></i><span>Product Image</span></div>
        <div class="panel-body" style="padding:18px">
          <!-- Hidden flag for image removal -->
          <input type="hidden" name="removeImage" id="removeImageField" value="false"/>

          <!-- Current image with delete option -->
          <div th:if="${existingImage}" id="currentImgWrap" style="text-align:center;margin-bottom:12px">
            <div style="position:relative;display:inline-block">
              <img id="currentProductImg"
                   th:src="@{'/' + ${existingImage}}"
                   style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--border)"
                   onerror="this.parentElement.parentElement.style.display='none'"/>
              <button type="button"
                      onclick="removeProductImage()"
                      title="Delete image"
                      style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;padding:0;line-height:1">
                <i class="bi bi-x-lg" style="font-size:10px"></i>
              </button>
            </div>
            <div style="font-size:.75rem;color:var(--text-3);margin-top:4px">Current image</div>
          </div>

          <!-- Removed notice -->
          <div id="removedNotice" style="display:none;text-align:center;margin-bottom:12px">
            <div style="width:120px;height:120px;margin:0 auto;border-radius:12px;border:2px dashed var(--bad);background:var(--bad-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
              <i class="bi bi-image" style="font-size:1.5rem;color:var(--bad)"></i>
              <span style="font-size:.65rem;color:var(--bad)">Removed</span>
            </div>
            <button type="button" onclick="undoRemoveProductImage()" class="btn-ghost" style="font-size:.72rem;margin-top:6px">Undo</button>
          </div>

          <!-- New image preview -->
          <div id="newImgPreview" style="display:none;text-align:center;margin-bottom:12px">
            <img id="newImgTag" style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:2px solid var(--primary)"/>
            <div style="font-size:.75rem;color:var(--primary);margin-top:4px">New image</div>
          </div>

          <label class="dropzone" style="display:flex" for="productImageInput">
            <span class="icon"><i class="bi bi-upload"></i></span>
            <b th:text="${existingImage} ? 'Upload new image to replace' : 'Choose product image'">Choose product image</b>
            <span>PNG, JPG, WEBP up to 10MB</span>
          </label>
          <input type="file" name="imageFile" id="productImageInput"
                 class="form-control" accept="image/jpeg,image/png,image/gif,image/webp"
                 onchange="previewNewProductImage(this)" style="margin-top:10px"/>
          <div class="hint">Leave blank to keep current image</div>
        </div>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <a th:href="@{/products}" class="btn-cancel">Cancel</a>
    <button type="submit" class="btn-save">
      <i class="bi bi-check-lg"></i>
      <span th:text="${productId != null ? 'Update Product' : 'Create Product'}">Save Product</span>
    </button>
  </div>
</form>

</th:block>
<th:block th:fragment="scripts">
<style>
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:800px){.form-grid{grid-template-columns:1fr}}
.form-grid .field.full{grid-column:1/-1}
.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.field .hint{font-size:11px;color:var(--text-3);margin-top:6px}
.price-prefix{position:relative}
.price-prefix span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--text-3);font-weight:600;pointer-events:none}
.price-prefix input{padding-left:38px}

.dropzone{border:2px dashed var(--border);border-radius:14px;padding:22px;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;background:var(--surface-2);transition:border-color .2s,background .2s;cursor:pointer}
.dropzone:hover{border-color:var(--primary);background:var(--primary-soft)}
.dropzone .icon{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto}
.dropzone .icon i{font-size:17px;color:var(--primary)}
.dropzone b{font-size:12px;display:block;margin-top:2px}
.dropzone > span:not(.icon){font-size:10.5px;color:var(--text-3)}

.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.btn-cancel{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:11px;padding:11px 20px;font-size:13px;font-weight:700;transition:background .18s;display:inline-flex;align-items:center}
.btn-cancel:hover{background:var(--surface-2)}
.btn-save{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border:0;border-radius:11px;padding:11px 22px;font-size:13px;font-weight:700;box-shadow:0 8px 20px -6px rgba(91,63,201,.5);transition:filter .18s,transform .12s}
.btn-save:hover{filter:brightness(1.1);transform:translateY(-1px)}
@media (max-width:900px){.grid{grid-template-columns:1fr!important}}
@media (max-width:700px){.form-grid{grid-template-columns:1fr!important}}
</style>
<script>
function removeProductImage() {
  document.getElementById('removeImageField').value = 'true';
  var wrap = document.getElementById('currentImgWrap');
  if (wrap) wrap.style.display = 'none';
  document.getElementById('removedNotice').style.display = 'block';
  document.getElementById('productImageInput').value = '';
  document.getElementById('newImgPreview').style.display = 'none';
}

function undoRemoveProductImage() {
  document.getElementById('removeImageField').value = 'false';
  document.getElementById('removedNotice').style.display = 'none';
  var wrap = document.getElementById('currentImgWrap');
  if (wrap) wrap.style.display = 'block';
}

function previewNewProductImage(input) {
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('newImgTag').src = e.target.result;
      document.getElementById('newImgPreview').style.display = 'block';
      document.getElementById('removeImageField').value = 'false';
      document.getElementById('removedNotice').style.display = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  } else {
    document.getElementById('newImgPreview').style.display = 'none';
  }
}
</script>
</th:block>
</html>
