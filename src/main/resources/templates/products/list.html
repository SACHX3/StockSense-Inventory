<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></div>
    <div>
      <h1>Products</h1>
      <p>Manage your product catalog, stock levels and pricing</p>
    </div>
  </div>
  <div class="head-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <a th:href="@{/products/low-stock}" class="btn-ghost warn">
      <i class="bi bi-exclamation-triangle"></i> Low Stock
      <span class="tag risk" th:text="${lowStockCount}">0</span>
    </a>
    <a th:href="@{/products/create}" class="btn-primary" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
      <i class="bi bi-plus-lg"></i> Add Product
    </a>
  </div>
</div>

<form method="get" th:action="@{/products}" class="filter-bar-panel">
  <div class="field search-field">
    <div class="search-wrap" id="plSearchBox" style="position:relative">
      <i class="bi bi-search"></i>
      <input type="text" name="keyword" id="plSearchInput" class="form-control" placeholder="Search by name, SKU or barcode..." th:value="${keyword}" autocomplete="off"/>
      <div class="qs-dropdown" id="plQsDropdown"></div>
    </div>
  </div>
  <button type="submit" class="btn-primary"><i class="bi bi-search"></i> Search</button>
  <a th:href="@{/products}" class="btn-ghost"><i class="bi bi-x"></i> Reset</a>
</form>

<div class="result-count" th:if="${products.totalElements != null}"
     th:text="'Showing ' + ${products.numberOfElements} + ' of ' + ${products.totalElements} + ' products'"></div>

<div class="product-grid stagger">
  <p th:if="${products.content.isEmpty()}" style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:24px">No products found.</p>

  <div class="pcard" th:each="p : ${products.content}">
    <div class="pcard-img">
      <span class="cat-badge" th:text="${p.category.name}">Category</span>
      <span th:classappend="${p.isActive} ? 'active-badge on' : 'active-badge off'"
            th:text="${p.isActive} ? 'Active' : 'Inactive'">Active</span>
      <img th:if="${p.imagePath}" th:src="@{'/'+${p.imagePath}}" style="display:block;width:100%;height:100%;max-width:100%;max-height:110px;object-fit:contain;padding:10px;" onerror="this.style.display='none'"/>
      <i th:unless="${p.imagePath}" class="bi bi-box-seam"></i>
    </div>
    <div class="pcard-body">
      <div class="pcard-name" th:text="${p.name}">Name</div>
      <div class="pcard-sku" th:text="'SKU: ' + ${p.sku}">SKU</div>
      <div class="pcard-stock">
        <span th:classappend="${p.quantity == 0} ? 'stock-dot bad' : (${p.quantity <= p.minStockLevel} ? 'stock-dot warn' : 'stock-dot good')"></span>
        <span th:classappend="${p.quantity == 0} ? 'stock-bad' : (${p.quantity <= p.minStockLevel} ? 'stock-warn' : 'stock-good')"
              th:text="${p.quantity} + ' ' + ${p.unit} + ' — ' + (${p.quantity == 0} ? 'Out of Stock' : (${p.quantity <= p.minStockLevel} ? 'Low Stock' : 'In Stock'))">0 pcs</span>
      </div>
      <div class="pcard-price">
        <span th:text="'Buy Rs. ' + ${#numbers.formatDecimal(p.buyingPrice, 0, 'COMMA', 2, 'POINT')}">Buy</span>
        <b th:text="'Sell Rs. ' + ${#numbers.formatDecimal(p.sellingPrice, 0, 'COMMA', 2, 'POINT')}">Sell</b>
      </div>
      <div class="pcard-actions">
        <a th:href="@{'/products/view/' + ${p.id}}" class="icon-btn"><i class="bi bi-eye"></i>View</a>
        <a th:href="@{'/products/edit/' + ${p.id}}" class="icon-btn" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')"><i class="bi bi-pencil"></i>Edit</a>
        <form th:action="@{'/products/delete/' + ${p.id}}" method="post" style="display:contents"
              sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Delete this product?')">
          <button type="submit" class="icon-btn danger"><i class="bi bi-trash"></i></button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Pagination -->
<div class="pagination" th:if="${products.totalPages > 1}">
  <a th:href="@{/products(page=${products.number - 1}, keyword=${keyword})}"
     th:classappend="${products.first} ? 'page-btn disabled' : 'page-btn'" aria-label="Previous">
    <i class="bi bi-arrow-left"></i>
  </a>
  <a th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
     th:href="@{/products(page=${i}, keyword=${keyword})}"
     th:classappend="${i == products.number} ? 'page-btn active' : 'page-btn'"
     th:text="${i + 1}">1</a>
  <a th:href="@{/products(page=${products.number + 1}, keyword=${keyword})}"
     th:classappend="${products.last} ? 'page-btn disabled' : 'page-btn'" aria-label="Next">
    <i class="bi bi-arrow-right"></i>
  </a>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.filter-bar-panel{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px}
.filter-bar-panel .field{margin-bottom:0}
.filter-bar-panel .field label{display:block;font-size:10.5px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.search-field{flex:1;min-width:220px}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap i,.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;width:15px;height:15px;pointer-events:none}
.search-wrap input{width:100%;padding-left:36px}

.result-count{text-align:center;font-size:11.5px;color:var(--text-3);margin-bottom:14px}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:24px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.pcard:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--primary) 30%, var(--border));box-shadow:0 10px 24px -12px color-mix(in srgb, var(--primary) 35%, transparent)}
.pcard-img{width:100%;aspect-ratio:1.9;max-height:110px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px;overflow:hidden}
.pcard-img i{font-size:22px;color:var(--text-3)}
.pcard-img img{width:100%;height:100%;object-fit:contain;padding:10px}
.pcard-img .cat-badge{position:absolute;top:8px;left:8px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-size:10px;font-weight:700;color:var(--primary)}
.pcard-img .active-badge{position:absolute;top:8px;right:8px;border-radius:20px;padding:3px 8px;font-size:9.5px;font-weight:700}
.active-badge.on{background:var(--good-soft);color:var(--good)}
.active-badge.off{background:var(--bad-soft);color:var(--bad)}
.pcard-body{padding:0}
.pcard-name{font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard-sku{font-size:10.5px;color:var(--text-3);margin-bottom:8px}
.pcard-stock{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stock-dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.stock-dot.good{background:var(--good)}
.stock-dot.warn{background:var(--warn)}
.stock-dot.bad{background:var(--bad)}
.pcard-stock span{font-size:11.5px;font-weight:600}
.pcard-stock span.stock-good{color:var(--good)}
.pcard-stock span.stock-warn{color:var(--warn)}
.pcard-stock span.stock-bad{color:var(--bad)}
.pcard-price{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:10px;padding-top:8px;border-top:1px solid var(--border)}
.pcard-price b{color:var(--primary);font-weight:800;font-size:13.5px}
:root[data-theme="dark"] .pcard-price b{color:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pcard-price b{color:#ffffff}}
.pcard-actions{display:flex;gap:6px}
.icon-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px;font-size:11px;font-weight:600;color:var(--text-2);transition:background .18s,color .18s,border-color .18s}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, var(--border))}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.page-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;transition:background .18s,color .18s,border-color .18s}
.page-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.page-btn.active{background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border-color:transparent}
.page-btn.disabled{opacity:.4;pointer-events:none}
</style>
<script>
(function () {
  var input = document.getElementById('plSearchInput');
  var box = document.getElementById('plSearchBox');
  var dropdown = document.getElementById('plQsDropdown');
  if (!input || !dropdown) return;

  var debounceTimer = null;
  var activeIndex = -1;
  var currentItems = [];
  var currentController = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function stockClass(p) {
    if (p.quantity === 0) return 'out';
    if (p.minStockLevel && p.quantity <= p.minStockLevel) return 'low';
    return 'ok';
  }
  function stockLabel(p) {
    if (p.quantity === 0) return 'Out';
    if (p.minStockLevel && p.quantity <= p.minStockLevel) return 'Low';
    return 'OK';
  }
  function renderItems(products, keyword) {
    currentItems = products || [];
    activeIndex = -1;
    if (!currentItems.length) {
      dropdown.innerHTML = '<div class="qs-dropdown-empty">No products match "' + escapeHtml(keyword) + '"</div>';
      dropdown.classList.add('open');
      return;
    }
    var html = currentItems.map(function (p, i) {
      var thumb = p.imagePath
        ? '<img src="/' + escapeHtml(p.imagePath) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';"/><i class="bi bi-box-seam" style="display:none;"></i>'
        : '<i class="bi bi-box-seam"></i>';
      return '<a href="/products/view/' + p.id + '" class="qs-item" data-idx="' + i + '">' +
        '<span class="qs-item-thumb">' + thumb + '</span>' +
        '<span class="qs-item-info">' +
          '<span class="qs-item-name">' + escapeHtml(p.name) + '</span>' +
          '<span class="qs-item-meta">' + escapeHtml(p.sku || '') + ' &middot; ' + p.quantity + ' ' + escapeHtml(p.unit || '') + '</span>' +
        '</span>' +
        '<span class="qs-item-stock ' + stockClass(p) + '">' + stockLabel(p) + '</span>' +
      '</a>';
    }).join('');
    dropdown.innerHTML = html;
    dropdown.classList.add('open');
  }
  function closeDropdown() {
    dropdown.classList.remove('open');
    dropdown.innerHTML = '';
    activeIndex = -1;
    currentItems = [];
  }
  function runSearch(keyword) {
    if (currentController) { try { currentController.abort(); } catch (e) {} }
    currentController = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    box.classList.add('qs-loading');
    fetch('/products/api/search?keyword=' + encodeURIComponent(keyword), {
      credentials: 'same-origin',
      signal: currentController ? currentController.signal : undefined
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        box.classList.remove('qs-loading');
        renderItems((res && res.data) || [], keyword);
      })
      .catch(function (err) {
        if (err && err.name === 'AbortError') return;
        box.classList.remove('qs-loading');
        dropdown.innerHTML = '<div class="qs-dropdown-empty">Search failed. Try again.</div>';
        dropdown.classList.add('open');
      });
  }
  input.addEventListener('input', function () {
    var v = input.value.trim();
    clearTimeout(debounceTimer);
    if (!v) { closeDropdown(); box.classList.remove('qs-loading'); return; }
    debounceTimer = setTimeout(function () { runSearch(v); }, 260);
  });
  input.addEventListener('keydown', function (e) {
    var items = dropdown.querySelectorAll('.qs-item');
    if (e.key === 'ArrowDown') {
      if (!items.length) return;
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, items.length - 1);
      items.forEach(function (el, i) { el.classList.toggle('qs-active', i === activeIndex); });
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      if (!items.length) return;
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      items.forEach(function (el, i) { el.classList.toggle('qs-active', i === activeIndex); });
      items[activeIndex].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      if (activeIndex >= 0 && items[activeIndex]) {
        e.preventDefault();
        window.location.href = items[activeIndex].getAttribute('href');
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#plSearchBox') && !e.target.closest('#plQsDropdown')) closeDropdown();
  });
})();
</script>
</th:block>
</html>
