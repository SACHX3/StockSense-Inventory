<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg></div>
    <div>
      <h1 th:text="${product.name}">Product Name</h1>
      <p th:text="'SKU: ' + ${product.sku} + ' &middot; ' + ${product.category.name}">SKU &middot; Category</p>
    </div>
  </div>
  <div class="head-actions">
    <a th:href="@{/products}" class="btn-ghost"><i class="bi bi-arrow-left"></i> Back</a>
  </div>
</div>

<div class="view-grid stagger">
  <!-- LEFT column -->
  <div>
    <div class="view-img">
      <img th:if="${product.imagePath}" th:src="@{'/'+${product.imagePath}}" style="display:block;width:100%;height:100%;max-width:100%;max-height:260px;object-fit:cover" onerror="this.style.display='none'"/>
      <i th:unless="${product.imagePath}" class="bi bi-box-seam"></i>
    </div>
    <div class="view-actions">
      <a th:href="@{'/products/edit/' + ${product.id}}" class="btn-ghost info" style="justify-content:center" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')"><i class="bi bi-pencil"></i>Edit</a>
      <form th:action="@{'/products/delete/' + ${product.id}}" method="post" style="display:contents"
            sec:authorize="hasRole('ADMIN')" onsubmit="return confirm('Delete this product?')">
        <button type="submit" class="btn-ghost warn" style="justify-content:center"><i class="bi bi-trash"></i>Delete</button>
      </form>
    </div>

    <div class="panel" style="margin-top:18px">
      <div class="panel-head"><i class="bi bi-info-circle"></i><span>Key Info</span></div>
      <div class="panel-body" style="padding:4px 18px">
        <div class="kv-row"><span class="k">SKU</span><span class="v"><code th:text="${product.sku}"></code></span></div>
        <div class="kv-row"><span class="k">Barcode</span><span class="v" th:text="${product.barcode ?: '-'}"></span></div>
        <div class="kv-row"><span class="k">Category</span><span class="v" th:text="${product.category.name}"></span></div>
        <div class="kv-row"><span class="k">Supplier</span><span class="v" th:text="${product.supplier != null ? product.supplier.name : '-'}"></span></div>
        <div class="kv-row"><span class="k">Unit</span><span class="v" th:text="${product.unit}"></span></div>
        <div class="kv-row"><span class="k">Status</span><span class="v">
          <span th:classappend="${product.isActive} ? 'active-badge on' : 'active-badge off'"
                th:text="${product.isActive} ? 'Active' : 'Inactive'">Status</span>
        </span></div>
      </div>
    </div>
  </div>

  <!-- RIGHT column -->
  <div>
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stitle">Buying Price</div>
        <div class="sval" th:text="'Rs. ' + ${#numbers.formatDecimal(product.buyingPrice, 0, 'COMMA', 2, 'POINT')}">Rs. 0</div>
        <div class="ssub">per unit</div>
      </div>
      <div class="stat-card">
        <div class="stitle">Selling Price</div>
        <div class="sval" th:text="'Rs. ' + ${#numbers.formatDecimal(product.sellingPrice, 0, 'COMMA', 2, 'POINT')}">Rs. 0</div>
        <div class="ssub">per unit</div>
      </div>
      <div class="stat-card">
        <div class="stitle">Margin</div>
        <div class="sval margin-good"
             th:text="${product.sellingPrice != null and product.sellingPrice.doubleValue() > 0 ? #numbers.formatDecimal((product.sellingPrice.doubleValue() - product.buyingPrice.doubleValue()) / product.sellingPrice.doubleValue() * 100, 0, 'COMMA', 1, 'POINT') + '%' : '-'}">0%</div>
        <div class="ssub" th:text="'Rs. ' + ${#numbers.formatDecimal(product.sellingPrice.doubleValue() - product.buyingPrice.doubleValue(), 0, 'COMMA', 2, 'POINT')} + ' profit / unit'">profit</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><i class="bi bi-boxes"></i><span>Stock Level</span></div>
      <div class="panel-body" style="padding:18px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
          <div style="font-size:24px;font-weight:800"
               th:classappend="${product.quantity <= product.minStockLevel} ? 'bad-text' : ''"
               th:style="${product.quantity <= product.minStockLevel} ? 'color:var(--bad)' : ''">
            <span th:text="${product.quantity}">0</span>
            <span style="font-size:12px;font-weight:600;color:var(--text-3)" th:text="${product.unit} + ' in stock'">pcs in stock</span>
          </div>
          <div style="font-size:12px;color:var(--text-3)">Stock value:
            <b style="color:var(--text)" th:text="'Rs. ' + ${#numbers.formatDecimal(product.quantity * product.buyingPrice.doubleValue(), 0, 'COMMA', 2, 'POINT')}">Rs. 0</b>
          </div>
        </div>
        <div class="stock-bar-wrap">
          <div class="stock-bar-track">
            <div class="stock-bar-fill"
                 th:style="'width:' + (${product.maxStockLevel != null and product.maxStockLevel > 0} ? ${#numbers.formatDecimal(product.quantity * 100.0 / product.maxStockLevel, 0, 'COMMA', 1, 'POINT')} : 0) + '%'"></div>
          </div>
          <div class="stock-marks">
            <span th:text="'Min: ' + ${product.minStockLevel}">Min</span>
            <span th:text="'Current: ' + ${product.quantity}">Current</span>
            <span th:text="'Max: ' + ${product.maxStockLevel}">Max</span>
          </div>
        </div>
      </div>
    </div>

    <div class="panel" th:if="${product.description}">
      <div class="panel-head"><i class="bi bi-file-text"></i><span>Description</span></div>
      <div class="panel-body" style="padding:18px">
        <p style="margin:0;color:var(--text-2)" th:text="${product.description}"></p>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><i class="bi bi-clipboard-data"></i><span>Related</span></div>
      <div class="panel-body" style="padding:18px;display:flex;gap:10px;flex-wrap:wrap">
        <a th:href="@{'/inventory/product/' + ${product.id}}" class="btn-ghost info">
          <i class="bi bi-clipboard-data"></i>View Inventory History
        </a>
        <a th:href="@{'/forecasting/product/' + ${product.id}}" class="btn-ghost warn" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
          <i class="bi bi-graph-up-arrow"></i>View Forecast
        </a>
      </div>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.view-grid{display:grid;grid-template-columns:300px 1fr;gap:20px}
@media (max-width:900px){.view-grid{grid-template-columns:1fr}}
.view-img{width:100%;height:260px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;margin-bottom:18px;overflow:hidden}
.view-img i{font-size:56px;color:var(--text-3)}
.view-actions{display:flex;gap:10px}
.view-actions .btn-ghost,.view-actions button{flex:1}

.kv-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.kv-row + .kv-row{border-top:1px solid var(--border)}
.kv-row .k{font-size:11.5px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kv-row .v{font-size:12.5px;font-weight:700}

.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media (max-width:700px){.stat-cards{grid-template-columns:1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.stat-card .stitle{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.stat-card .sval{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stat-card .ssub{font-size:11.5px;color:var(--text-2);margin-top:4px}
.margin-good{color:var(--good)}

.stock-bar-wrap{margin-top:8px}
.stock-bar-track{height:10px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;position:relative}
.stock-bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good))}
.stock-marks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:6px}

.active-badge{font-size:10px;font-weight:700;border-radius:20px;padding:4px 9px;display:inline-flex}
.active-badge.on{background:var(--good-soft);color:var(--good)}
.active-badge.off{background:var(--bad-soft);color:var(--bad)}
@media (max-width:900px){.view-grid{grid-template-columns:1fr!important}}
@media (max-width:700px){.stat-cards{grid-template-columns:1fr!important}}
</style>
</th:block>
</html>
