<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<a class="back-link" th:href="@{/sales}">
  <i class="bi bi-arrow-left"></i> Back to Sales
</a>

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-sales"><i class="bi bi-file-earmark-text"></i></div>
    <div>
      <h1 th:text="${sale.invoiceNumber}">INV</h1>
      <p>
        Sale recorded <span th:text="${#temporals.format(sale.createdAt, 'dd MMM yyyy')}"></span>
        at <span th:text="${#temporals.format(sale.createdAt, 'HH:mm')}"></span>
        <span th:if="${sale.user != null}"> by <span th:text="${sale.user.fullName}"></span></span>
      </p>
    </div>
  </div>
  <div class="head-actions" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <a th:href="@{'/sales/receipt/' + ${sale.id}}" class="btn-ghost info" target="_blank"><i class="bi bi-printer"></i> Print Receipt</a>
  </div>
</div>

<div class="panel">
  <div class="detail-head">
    <div class="detail-grid" style="flex:1">
      <div class="detail-block">
        <div class="lbl">Customer</div>
        <div class="val" th:text="${sale.customerName ?: 'Walk-in Customer'}">Customer</div>
        <div class="val sub" th:if="${sale.customerPhone}" th:text="${sale.customerPhone}"></div>
      </div>
      <div class="detail-block">
        <div class="lbl">Cashier</div>
        <div class="val" th:text="${sale.user != null ? sale.user.fullName : '-'}">-</div>
      </div>
      <div class="detail-block">
        <div class="lbl">Payment Method</div>
        <div class="val"><span class="tag" th:text="${sale.paymentMethod}">CASH</span></div>
      </div>
      <div class="detail-block">
        <div class="lbl">Payment Status</div>
        <div class="val">
          <span th:if="${sale.paymentStatus.name() == 'PAID'}" class="tag ok" th:text="${sale.paymentStatus}">PAID</span>
          <span th:unless="${sale.paymentStatus.name() == 'PAID'}" class="tag risk" th:text="${sale.paymentStatus}">PENDING</span>
        </div>
      </div>
    </div>
  </div>

  <div style="overflow-x:auto">
    <table class="table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Unit Price</th>
          <th>Qty</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="item : ${sale.items}">
          <td><b th:text="${item.product.name}">Product</b></td>
          <td th:text="'Rs. ' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')}">0</td>
          <td th:text="${item.quantity}">0</td>
          <td><b th:text="'Rs. ' + ${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 2, 'POINT')}">0</b></td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="totals-summary">
    <div class="ts-row"><span>Subtotal</span><span th:text="'Rs. ' + ${#numbers.formatDecimal(sale.subtotal, 0, 'COMMA', 2, 'POINT')}"></span></div>
    <div class="ts-row" th:if="${sale.discountAmount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
      <span>Discount</span><span th:text="'- Rs. ' + ${#numbers.formatDecimal(sale.discountAmount, 0, 'COMMA', 2, 'POINT')}"></span>
    </div>
    <div class="ts-row grand"><span>Total</span><span th:text="'Rs. ' + ${#numbers.formatDecimal(sale.totalAmount, 0, 'COMMA', 2, 'POINT')}"></span></div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:14px;transition:color .15s}
.back-link:hover{color:var(--primary)}
.back-link i{width:14px;height:14px}
.detail-head{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:20px 22px}
.detail-block .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);font-weight:700;margin-bottom:5px}
.detail-block .val{font-size:13.5px;font-weight:600}
.detail-block .val.sub{font-size:11.5px;color:var(--text-3);font-weight:500;margin-top:1px}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media (max-width:900px){.detail-grid{grid-template-columns:repeat(2,1fr)}}
.totals-summary{max-width:340px;margin-left:auto;padding:16px 22px}
.ts-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);padding:5px 0}
.ts-row.grand{border-top:1px solid var(--border);margin-top:6px;padding-top:11px;font-size:17px;font-weight:800;color:var(--text)}
@media (max-width:820px){.detail-grid{grid-template-columns:repeat(2,1fr)!important}}
@media (max-width:480px){.detail-grid{grid-template-columns:1fr!important}}
</style>
</th:block>
</html>
