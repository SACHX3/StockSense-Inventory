# ==========================================
# StockSense - AI-Powered Inventory Management System
# ==========================================

server.port=8080
spring.application.name=StockSense

# ==========================================
# Database - MySQL via XAMPP
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/smart_inventory_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ==========================================
# JPA / Hibernate
# Tell Hibernate which MySQL it is actually talking to. Without this it assumes the
# floor version (5.5) and logs at every startup:
#   HHH000511: The 5.5.0 version for MySQLDialect is no longer supported...
# 8.0 also lets it use the newer function/DDL support instead of 5.5-era fallbacks.
# Lower this if your MySQL really is older (5.7 is the minimum Hibernate 6 supports).
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.jakarta.persistence.database-product-name=MySQL
spring.jpa.properties.jakarta.persistence.database-major-version=8
spring.jpa.properties.jakarta.persistence.database-minor-version=0

# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Removed MySQL8Dialect - Spring Boot auto-detects correctly

# ==========================================
# Thymeleaf
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==========================================
# File Upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

app.upload.dir=uploads
app.upload.products-dir=uploads/products
app.upload.invoices-dir=uploads/invoices
app.upload.reports-dir=uploads/reports

# ==========================================
# FastAPI AI Service
# ==========================================
app.ai-service.base-url=http://localhost:8000
app.ai-service.forecast-endpoint=/api/forecast/predict
app.ai-service.ocr-endpoint=/api/ocr/process
app.ai-service.retrain-endpoint=/api/forecast/retrain
app.ai-service.timeout-seconds=60

# Auto-start the FastAPI OCR + forecasting service together with Spring Boot.
# Works on Windows and macOS/Linux; set to false to manage it yourself.
app.ai-service.auto-start=true
app.ai-service.startup-timeout-seconds=180
# Leave blank to auto-detect (fastapi-service/venv, then python3/python on PATH)
app.ai-service.python-executable=
# Leave blank to auto-detect the fastapi-service folder next to this project
app.ai-service.working-dir=

# ==========================================
# Logging
# ==========================================
logging.level.com.stocksense=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{20} - %msg%n

# Suppress open-in-view warning
spring.jpa.open-in-view=false

# ==========================================
# Timezone - Sri Lanka (UTC+5:30)
# ==========================================
spring.jackson.time-zone=Asia/Colombo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss

# ==========================================
# Demo data seeding
# ==========================================
# Password for the seeded demo accounts (admin / manager / staff1).
app.seed.password=admin123
# Recovery switch: reset the admin password to the seed value on next startup.
app.seed.reset-admin-password=false
# Set true ONCE to delete and regenerate the INV-SEED-* demo sales with the
# per-product weekday demand profiles, then set it back to false. Sales entered
# through the POS are never touched.
app.seed.reset-sample-sales=false
