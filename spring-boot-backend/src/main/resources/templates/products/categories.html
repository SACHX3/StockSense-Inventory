<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-head">
  <div class="page-head-title-row">
    <div class="page-head-icon ph-categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 12 22l-9-9V3h9l8.6 8.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></div>
    <div>
      <h1>Categories</h1>
      <p>Organize products into categories for easier browsing and reporting</p>
    </div>
  </div>
  <div class="head-actions">
    <button class="btn-primary" data-bs-toggle="modal" data-bs-target="#addCatModal"
            sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
      <i class="bi bi-plus-lg"></i> Add Category
    </button>
  </div>
</div>

<div class="cat-grid stagger">
  <p th:if="${#lists.isEmpty(categories)}" style="grid-column:1/-1;text-align:center;color:var(--text-3);padding:24px">No categories found.</p>

  <div class="ccard" th:each="cat : ${categories}">
    <div class="ccard-top">
      <span th:classappend="${cat.isActive} ? 'active-badge on' : 'active-badge off'"
            th:text="${cat.isActive} ? 'Active' : 'Inactive'">Active</span>
      <img th:if="${cat.imagePath}" th:src="@{'/' + ${cat.imagePath}}" style="display:block;width:100%;height:100%;max-width:100%;max-height:110px;object-fit:contain;padding:10px"
           onerror="this.parentElement.querySelector('i').style.display='flex';this.style.display='none'"/>
      <i class="bi bi-tags" th:style="${cat.imagePath} ? 'display:none' : ''"></i>
    </div>
    <div class="ccard-body">
      <div class="ccard-name" th:text="${cat.name}">Name</div>
      <div class="ccard-desc" th:text="${cat.description ?: 'No description'}">Description</div>
      <div class="ccard-actions" sec:authorize="hasAnyRole('ADMIN','INVENTORY_MANAGER')">
        <button class="icon-btn edit-cat-btn"
                th:data-id="${cat.id}"
                th:data-name="${cat.name}"
                th:data-desc="${cat.description ?: ''}"
                th:data-image="${cat.imagePath ?: ''}">
          <i class="bi bi-pencil"></i>Edit
        </button>
        <form th:action="@{'/categories/delete/' + ${cat.id}}" method="post"
              style="display:contents" sec:authorize="hasRole('ADMIN')"
              onsubmit="return confirm('Delete this category?')">
          <button type="submit" class="icon-btn danger"><i class="bi bi-trash"></i></button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ── Add Category Modal ──────────────────────────────────────── -->
<div class="modal fade" id="addCatModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form th:action="@{/categories/create}" method="post" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-plus-lg"></i> Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Category Name *</label>
            <input type="text" name="name" class="form-control" required placeholder="e.g. Beverages"/>
          </div>
          <div class="field">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="2" placeholder="Short description"></textarea>
          </div>
          <div class="field">
            <label>Category Image <span style="text-transform:none;font-weight:400">(optional)</span></label>
            <input type="file" name="imageFile" class="form-control"
                   accept="image/jpeg,image/png,image/gif,image/webp"
                   onchange="previewAddImg(this)"/>
            <div id="addPreview" style="display:none;margin-top:8px">
              <img id="addPreviewImg" style="height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--border)"/>
            </div>
            <div class="hint">JPG, PNG, WEBP — optional</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-save"><i class="bi bi-plus-lg"></i> Create</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ── Edit Category Modal ─────────────────────────────────────── -->
<div class="modal fade" id="editCatModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editCatForm" method="post" enctype="multipart/form-data">
        <!-- action is assigned in JS, so Thymeleaf cannot inject the CSRF field here. -->
        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
               th:value="${_csrf != null ? _csrf.token : ''}"/>
        <input type="hidden" name="removeImage" id="removeImageField" value="false"/>
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil"></i> Edit Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Category Name *</label>
            <input type="text" id="editName" name="name" class="form-control" required/>
          </div>
          <div class="field">
            <label>Description</label>
            <textarea id="editDesc" name="description" class="form-control" rows="2"></textarea>
          </div>
          <div class="field">
            <label>Category Image</label>
            <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">

              <!-- Current image with delete overlay -->
              <div id="currentImgSection" style="display:none">
                <div style="position:relative;display:inline-block">
                  <img id="currentImgTag"
                       style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--border)"/>
                  <button type="button" onclick="removeCatImage()"
                          title="Delete image"
                          style="position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--bad);border:2px solid var(--surface);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0">
                    <i class="bi bi-x-lg" style="font-size:10px"></i>
                  </button>
                </div>
                <div style="font-size:.72rem;color:var(--text-3);margin-top:4px;text-align:center">Current</div>
              </div>

              <!-- Removed placeholder -->
              <div id="removedNotice" style="display:none">
                <div style="width:80px;height:80px;border-radius:10px;border:2px dashed var(--bad);background:var(--bad-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
                  <i class="bi bi-tags" style="font-size:1.4rem;color:var(--bad)"></i>
                  <span style="font-size:.62rem;color:var(--bad)">Removed</span>
                </div>
                <button type="button" onclick="undoRemoveCatImage()" class="btn-cancel"
                        style="font-size:.72rem;width:80px;margin-top:4px;padding:6px">Undo</button>
              </div>

              <!-- New image preview -->
              <div id="editPreview" style="display:none">
                <img id="editPreviewImg"
                     style="width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid var(--primary)"/>
                <div style="font-size:.72rem;color:var(--primary);margin-top:4px;text-align:center">New</div>
              </div>

              <!-- Upload input -->
              <div style="flex:1;min-width:180px">
                <input type="file" name="imageFile" id="editImageInput" class="form-control"
                       accept="image/jpeg,image/png,image/gif,image/webp"
                       onchange="previewEditImg(this)"/>
                <div class="hint">Leave blank to keep current image</div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-save"><i class="bi bi-check-lg"></i> Update</button>
        </div>
      </form>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts">
<style>
/* Card style matched to the Products list page (.pcard) for visual
   consistency across the app. */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:24px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:14px;transition:transform .15s,border-color .15s,box-shadow .15s;position:relative}
.ccard:hover{transform:translateY(-3px);border-color:color-mix(in srgb, var(--primary) 30%, var(--border));box-shadow:0 10px 24px -12px color-mix(in srgb, var(--primary) 35%, transparent)}
.ccard-top{width:100%;aspect-ratio:1.9;max-height:110px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:10px;overflow:hidden}
.ccard-top i{font-size:22px;color:var(--primary)}
.ccard-top img{width:100%;height:100%;object-fit:contain;padding:10px}
.ccard-top .active-badge{position:absolute;top:8px;right:8px;border-radius:20px;padding:3px 8px;font-size:9.5px;font-weight:700}
.active-badge.on{background:var(--good-soft);color:var(--good)}
.active-badge.off{background:var(--bad-soft);color:var(--bad)}
.ccard-body{padding:0}
.ccard-name{font-size:12.5px;font-weight:700;letter-spacing:-.005em;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard-desc{font-size:10.5px;color:var(--text-3);line-height:1.5;margin-bottom:10px;min-height:0;padding-top:8px;border-top:1px solid var(--border);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ccard-actions{display:flex;gap:6px}
.icon-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:7px;font-size:11px;font-weight:600;color:var(--text-2);transition:background .18s,color .18s,border-color .18s}
.icon-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:color-mix(in srgb, var(--primary) 30%, var(--border))}
.icon-btn.danger:hover{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb, var(--bad) 30%, var(--border))}

.field{margin-bottom:16px}
.field label{display:block;font-size:11.5px;font-weight:700;margin-bottom:8px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.field .hint{font-size:11px;color:var(--text-3);margin-top:6px}
.btn-cancel{background:var(--surface);border:1px solid var(--border);color:var(--text-2);border-radius:11px;padding:9px 16px;font-size:13px;font-weight:700}
.btn-cancel:hover{background:var(--surface-2)}
.btn-save{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);color:#fff;border:0;border-radius:11px;padding:9px 18px;font-size:13px;font-weight:700}
.btn-save:hover{filter:brightness(1.1)}
.status-strip{display:none;align-items:center;gap:9px;border-radius:10px;padding:11px 15px;font-size:12.5px;font-weight:600;margin-bottom:16px}
.status-strip.show{display:flex}
.status-strip.ok{background:var(--good-soft);color:var(--good)}
.status-strip.bad{background:var(--bad-soft);color:var(--bad)}
</style>
<script>
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.edit-cat-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id    = this.getAttribute('data-id');
      var name  = this.getAttribute('data-name');
      var desc  = this.getAttribute('data-desc');
      var image = this.getAttribute('data-image');

      document.getElementById('editCatForm').action     = '/categories/edit/' + id;
      document.getElementById('editName').value          = name;
      document.getElementById('editDesc').value          = desc;
      document.getElementById('removeImageField').value  = 'false';
      document.getElementById('editImageInput').value    = '';
      document.getElementById('editPreview').style.display    = 'none';
      document.getElementById('removedNotice').style.display  = 'none';

      var section = document.getElementById('currentImgSection');
      var tag     = document.getElementById('currentImgTag');
      if (image) {
        tag.src = '/' + image;
        tag.onerror = function() { section.style.display = 'none'; };
        section.style.display = 'block';
      } else {
        section.style.display = 'none';
      }
      new bootstrap.Modal(document.getElementById('editCatModal')).show();
    });
  });
});

function removeCatImage() {
  document.getElementById('removeImageField').value       = 'true';
  document.getElementById('currentImgSection').style.display = 'none';
  document.getElementById('removedNotice').style.display      = 'block';
  document.getElementById('editImageInput').value              = '';
  document.getElementById('editPreview').style.display         = 'none';
}

function undoRemoveCatImage() {
  document.getElementById('removeImageField').value       = 'false';
  document.getElementById('removedNotice').style.display      = 'none';
  document.getElementById('currentImgSection').style.display  = 'block';
}

function previewEditImg(input) {
  var div = document.getElementById('editPreview');
  var img = document.getElementById('editPreviewImg');
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) {
      img.src = e.target.result;
      div.style.display = 'block';
      document.getElementById('removeImageField').value       = 'false';
      document.getElementById('removedNotice').style.display      = 'none';
      document.getElementById('currentImgSection').style.display  = 'none';
    };
    reader.readAsDataURL(input.files[0]);
  } else {
    div.style.display = 'none';
  }
}

function previewAddImg(input) {
  var div = document.getElementById('addPreview');
  var img = document.getElementById('addPreviewImg');
  if (input.files && input.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) { img.src = e.target.result; div.style.display = 'block'; };
    reader.readAsDataURL(input.files[0]);
  } else {
    div.style.display = 'none';
  }
}
</script>
</th:block>
</html>
