<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${(store != null ? store.storeName : 'StockSense') + ' - Receipt ' + sale.invoiceNumber}">Receipt</title>
  <style>
    /* Palette kept in step with static/css/stocksense.css. This page is standalone
       (it does not use the app layout fragment), so the tokens are duplicated here
       - if you change them there, change them here too.

       Theme resolution matches the rest of the app: an explicit choice on
       <html data-theme> wins, and the OS preference is only the fallback. Without
       the data-theme rules the receipt ignored the in-app light/dark toggle and
       followed the OS instead, so a user in dark mode got a white receipt. */
    :root{
      --bg:#f5f5fc; --surface:#ffffff; --surface-2:#f2f1fb; --border:#e9e8f5;
      --text:#171522; --text-2:#65637a; --text-3:#9896ab;
      --primary:#6d3fd8; --primary-2:#a35bff; --primary-soft:#efeafe;
      --good:#17b26a; --warn:#f0a71b;
      --radius-sm:12px;
      --shadow:0 1px 2px rgba(23,21,34,.03), 0 10px 28px -14px rgba(109,63,216,.14);
      --brand-grad: linear-gradient(135deg,#2f4fd6 0%,#5b3fc9 50%,#8b4ce0 100%);
      --brand-shadow: 0 8px 20px -6px rgba(91,63,201,.5);
    }
    /* FlowMind dark palette - same values as stocksense.css */
    :root[data-theme="dark"]{
      --bg:#070912; --surface:#0f1219; --surface-2:#161a23;
      --border:rgba(255,255,255,.07);
      --text:#f7f9fc; --text-2:#97a1b6; --text-3:#68718a;
      --primary:#8b5cf6; --primary-2:#a78bfa; --primary-soft:rgba(139,92,246,.16);
      --good:#22c55e; --warn:#f5a524;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.85);
      --brand-grad: linear-gradient(135deg,#6d4bd8 0%,#8b5cf6 50%,#a78bfa 100%);
      --brand-shadow: 0 8px 20px -8px rgba(139,92,246,.55);
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#070912; --surface:#0f1219; --surface-2:#161a23;
        --border:rgba(255,255,255,.07);
        --text:#f7f9fc; --text-2:#97a1b6; --text-3:#68718a;
        --primary:#8b5cf6; --primary-2:#a78bfa; --primary-soft:rgba(139,92,246,.16);
        --good:#22c55e; --warn:#f5a524;
        --shadow:0 1px 2px rgba(0,0,0,.45), 0 18px 40px -20px rgba(0,0,0,.85);
        --brand-grad: linear-gradient(135deg,#6d4bd8 0%,#8b5cf6 50%,#a78bfa 100%);
        --brand-shadow: 0 8px 20px -8px rgba(139,92,246,.55);
      }
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:24px 16px 60px}
    a{color:inherit;text-decoration:none}
    button{font-family:inherit;cursor:pointer}

    .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
    .btn-ghost:hover{background:var(--surface-2)}

    .receipt-toolbar{max-width:380px;margin:0 auto 16px;display:flex;justify-content:flex-start;align-items:center}
    .receipt-wrap{max-width:380px;margin:0 auto 60px}
    .receipt-paper{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:26px 22px;font-family:'SF Mono','Consolas','Courier New',monospace}
    .r-center{text-align:center}
    .r-store-icon{width:36px;height:36px;border-radius:10px;background:var(--brand-grad);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
    .r-store-icon svg{width:18px;height:18px;color:#fff}
    .r-store-name{font-size:15px;font-weight:800;letter-spacing:.02em;font-family:-apple-system,sans-serif}
    .r-store-sub{font-size:10.5px;color:var(--text-3);margin-top:3px;font-family:-apple-system,sans-serif;line-height:1.5}
    .r-dashed{border:none;border-top:1.5px dashed var(--border);margin:16px 0}
    .r-meta-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);padding:2px 0}
    .r-meta-row b{color:var(--text);font-weight:700}
    .r-items{margin:4px 0}
    .r-item{padding:7px 0}
    .r-item-name{font-size:11.5px;font-weight:700;font-family:-apple-system,sans-serif}
    .r-item-calc{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-top:2px}
    .r-totals .r-row{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:var(--text-2)}
    .r-totals .r-row.grand{font-size:15px;font-weight:800;color:var(--text);border-top:1.5px dashed var(--border);margin-top:6px;padding-top:9px}
    .r-pay-row{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 0}
    .r-footer{text-align:center;font-size:11px;color:var(--text-3);margin-top:16px;font-family:-apple-system,sans-serif;line-height:1.7}
    .r-footer b{display:block;color:var(--text-2);font-size:12px;margin-bottom:2px}
    .r-barcode{display:flex;align-items:flex-end;gap:2px;justify-content:center;height:34px;margin:16px 0 6px}
    .r-barcode span{display:block;width:2px;background:var(--text)}

    .print-btn{width:100%;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand-grad);color:#fff;border:0;border-radius:11px;padding:13px;font-size:13.5px;font-weight:700;font-family:-apple-system,sans-serif;letter-spacing:-.005em;box-shadow:var(--brand-shadow)}
    .print-btn:hover{filter:brightness(1.1)}
    .print-btn svg{width:16px;height:16px}
    .btn-row{display:flex;gap:10px}
    .btn-row .print-btn{flex:1}

    /* PRINT: force the light palette back, whatever the screen theme is.
       Printing while in dark mode previously sent near-white --text to a white
       page - a blank-looking receipt that wasted the customer's paper. Printers
       drop backgrounds but honour text colour, so the ink has to be reset here. */
    @media print{
      :root, :root[data-theme="dark"], :root:not([data-theme="light"]){
        --bg:#ffffff; --surface:#ffffff; --surface-2:#ffffff; --border:#cccccc;
        --text:#000000; --text-2:#333333; --text-3:#555555;
        --good:#0a7a45; --warn:#8a5a00;
        --shadow:none;
      }
      .receipt-toolbar, .btn-row{display:none}
      body{background:#fff;padding:0;color:#000}
      .receipt-paper{box-shadow:none;border:none;background:#fff}
      /* The store badge is a solid colour block; printers usually strip it, so
         make sure the glyph inside is still legible if they don't. */
      .r-store-icon{background:none;border:1.5px solid #000}
      .r-store-icon svg{color:#000}
      .r-barcode span{background:#000}
    }
  </style>
  <script>
    // Standalone page: adopt the theme the user picked in the app (same
    // localStorage key stocksense.js uses). Runs in <head>, before first paint,
    // so the receipt never flashes the wrong theme. Wrapped in try/catch because
    // localStorage throws in private mode and on file:// origins.
    (function () {
      try {
        var t = localStorage.getItem('stocksense-theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) { /* fall back to prefers-color-scheme */ }
    })();
  </script>
</head>
<body>

<div class="receipt-toolbar">
  <button class="btn-ghost" onclick="window.close()">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Close
  </button>
</div>

<div class="receipt-wrap">
  <div class="receipt-paper">
    <div class="r-center">
      <div class="r-store-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg></div>
      <!-- Letterhead comes from Store Details (/settings/store), injected into every
           page by GlobalModelAdvice. Each line is omitted when the field is blank,
           so an unconfigured shop gets a clean receipt rather than empty rows. -->
      <div class="r-store-name" th:text="${store != null ? store.storeName : 'StockSense'}">StockSense</div>
      <div class="r-store-sub">
        <span th:if="${store != null and !#strings.isEmpty(store.tagline)}"
              th:text="${store.tagline}">Tagline</span>
        <br th:if="${store != null and !#strings.isEmpty(store.tagline)}"/>
        <span th:if="${store != null and !#strings.isEmpty(store.address)}"
              th:text="${store.address}">Address</span>
        <br th:if="${store != null and !#strings.isEmpty(store.address)}"/>
        <span th:if="${store != null and !#strings.isEmpty(store.phone)}"
              th:text="'Tel: ' + ${store.phone}">Tel</span>
        <br th:if="${store != null and !#strings.isEmpty(store.phone)}"/>
        <span th:if="${store != null and !#strings.isEmpty(store.taxNumber)}"
              th:text="'VAT: ' + ${store.taxNumber}">VAT</span>
      </div>
    </div>

    <hr class="r-dashed">

    <div class="r-meta-row"><span>Invoice #</span><b th:text="${sale.invoiceNumber}"></b></div>
    <div class="r-meta-row"><span>Date</span><b th:text="${#temporals.format(sale.createdAt, 'dd/MM/yyyy HH:mm')}"></b></div>
    <div class="r-meta-row"><span>Customer</span><b th:text="${sale.customerName ?: 'Walk-in'}"></b></div>
    <div class="r-meta-row"><span>Cashier</span><b th:text="${sale.user != null ? sale.user.username : '-'}"></b></div>

    <hr class="r-dashed">

    <div class="r-items">
      <div class="r-item" th:each="item : ${sale.items}">
        <div class="r-item-name" th:text="${item.product.name}"></div>
        <div class="r-item-calc">
          <span th:text="${item.quantity} + ' x Rs.' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 2, 'POINT')}"></span>
          <span th:text="'Rs. ' + ${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 2, 'POINT')}"></span>
        </div>
      </div>
    </div>

    <hr class="r-dashed">

    <div class="r-totals">
      <div class="r-row"><span>Subtotal</span><span th:text="'Rs. ' + ${#numbers.formatDecimal(sale.subtotal, 0, 'COMMA', 2, 'POINT')}"></span></div>
      <div class="r-row" th:if="${sale.discountAmount.compareTo(T(java.math.BigDecimal).ZERO) > 0}">
        <span>Discount</span><span th:text="'- Rs. ' + ${#numbers.formatDecimal(sale.discountAmount, 0, 'COMMA', 2, 'POINT')}"></span>
      </div>
      <div class="r-row grand"><span>TOTAL</span><span th:text="'Rs. ' + ${#numbers.formatDecimal(sale.totalAmount, 0, 'COMMA', 2, 'POINT')}"></span></div>
    </div>

    <hr class="r-dashed">

    <div class="r-pay-row"><span>Payment Method</span><b th:text="${sale.paymentMethod}"></b></div>

    <div class="r-barcode" aria-hidden="true">
      <span style="height:100%"></span><span style="height:70%"></span><span style="height:100%"></span><span style="height:55%"></span><span style="height:100%"></span><span style="height:80%"></span><span style="height:100%"></span><span style="height:60%"></span><span style="height:100%"></span><span style="height:90%"></span><span style="height:100%"></span><span style="height:65%"></span><span style="height:100%"></span><span style="height:75%"></span><span style="height:100%"></span><span style="height:50%"></span><span style="height:100%"></span><span style="height:85%"></span><span style="height:100%"></span><span style="height:60%"></span>
    </div>

    <div class="r-footer">
      <b th:text="${store != null and !#strings.isEmpty(store.receiptFooter)} ? ${store.receiptFooter} : 'Thank you for your purchase!'">Thank you for your purchase!</b>
      <span th:text="'*** ' + ${store != null ? store.storeName : 'StockSense'} + ' ***'">*** StockSense ***</span>
    </div>
  </div>

  <div class="btn-row">
    <button class="print-btn" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      Print
    </button>
  </div>
</div>

</body>
</html>
