<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">

<div class="page-header">
  <h4><i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>Reports</h4>
</div>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card text-center p-4">
      <i class="bi bi-receipt text-primary" style="font-size:2.5rem;"></i>
      <h5 class="mt-3 fw-600">Sales Report</h5>
      <p class="text-muted small">View detailed sales history and revenue analysis</p>
      <a th:href="@{/reports/sales}" class="btn btn-primary">
        <i class="bi bi-bar-chart me-1"></i>Generate Report
      </a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center p-4">
      <i class="bi bi-box-seam text-success" style="font-size:2.5rem;"></i>
      <h5 class="mt-3 fw-600">Inventory Report</h5>
      <p class="text-muted small">Current stock levels and low stock alerts</p>
      <a th:href="@{/reports/inventory}" class="btn btn-success">
        <i class="bi bi-clipboard-data me-1"></i>Generate Report
      </a>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card text-center p-4">
      <i class="bi bi-truck text-warning" style="font-size:2.5rem;"></i>
      <h5 class="mt-3 fw-600">Supplier Report</h5>
      <p class="text-muted small">Supplier list and purchase analysis</p>
      <a th:href="@{/reports/suppliers}" class="btn btn-warning text-dark">
        <i class="bi bi-truck me-1"></i>Generate Report
      </a>
    </div>
  </div>
</div>

<div class="row g-3">
  <div class="col-md-6">
    <div class="card p-3">
      <div class="d-flex align-items-center gap-3">
        <div style="width:48px;height:48px;background:#eff6ff;border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <i class="bi bi-currency-exchange text-info fs-4"></i>
        </div>
        <div>
          <div class="text-muted" style="font-size:.8rem;">Today's Revenue</div>
          <div class="fw-700 fs-5"
               th:text="${'Rs. ' + #numbers.formatDecimal(todayRevenue != null ? todayRevenue : 0, 1, 'COMMA', 2, 'POINT')}">Rs. 0.00</div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card p-3">
      <div class="d-flex align-items-center gap-3">
        <div style="width:48px;height:48px;background:#f0fdf4;border-radius:10px;display:flex;align-items:center;justify-content:center;">
          <i class="bi bi-calendar-month text-success fs-4"></i>
        </div>
        <div>
          <div class="text-muted" style="font-size:.8rem;">Monthly Revenue</div>
          <div class="fw-700 fs-5"
               th:text="${'Rs. ' + #numbers.formatDecimal(monthlyRevenue != null ? monthlyRevenue : 0, 1, 'COMMA', 2, 'POINT')}">Rs. 0.00</div>
        </div>
      </div>
    </div>
  </div>
</div>

</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
