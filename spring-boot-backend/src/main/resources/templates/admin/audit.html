<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
<div class="page-header">
  <h4><i class="bi bi-shield-check me-2 text-primary"></i>Audit Logs</h4>
</div>
<div class="card">
  <div class="card-body p-0">
    <table class="table table-sm table-hover mb-0">
      <thead><tr><th>Date</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th><th>IP</th></tr></thead>
      <tbody>
        <tr th:each="log : ${logs.content}">
          <td><small th:text="${#temporals.format(log.createdAt, 'dd MMM yy HH:mm')}"></small></td>
          <td><small class="fw-600" th:text="${log.username ?: 'system'}"></small></td>
          <td><span class="badge bg-light text-dark border" style="font-size:.72rem;" th:text="${log.action}">ACTION</span></td>
          <td><small th:text="${log.entityType ?: '-'}"></small></td>
          <td><small class="text-muted" th:text="${log.newValues != null && log.newValues.length() > 60 ? log.newValues.substring(0,60) + '...' : (log.newValues ?: '-')}"></small></td>
          <td><small class="text-muted" th:text="${log.ipAddress ?: '-'}"></small></td>
        </tr>
        <tr th:if="${logs.isEmpty()}"><td colspan="6" class="text-center py-4 text-muted">No audit logs found.</td></tr>
      </tbody>
    </table>
  </div>
  <div class="card-footer d-flex justify-content-between" th:if="${logs.totalPages > 1}">
    <small class="text-muted" th:text="${logs.totalElements} + ' total logs'"></small>
    <nav><ul class="pagination pagination-sm mb-0">
      <li th:classappend="${logs.first} ? 'page-item disabled' : 'page-item'">
        <a class="page-link" th:href="@{/audit(page=${logs.number - 1})}">«</a></li>
      <li th:classappend="${logs.last} ? 'page-item disabled' : 'page-item'">
        <a class="page-link" th:href="@{/audit(page=${logs.number + 1})}">»</a></li>
    </ul></nav>
  </div>
</div>
</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
