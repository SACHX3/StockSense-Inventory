<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, ~{::scripts})}">
<th:block th:fragment="content">
<div class="page-header">
  <h4><i class="bi bi-truck me-2 text-primary"></i>Supplier Details</h4>
  <div class="d-flex gap-2">
    <a th:href="@{'/suppliers/edit/' + ${supplier.id}}" class="btn btn-primary btn-sm"><i class="bi bi-pencil me-1"></i>Edit</a>
    <a th:href="@{/suppliers}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
  </div>
</div>
<div class="card">
  <div class="card-body">
    <div class="row g-3">
      <div class="col-md-6"><strong>Company Name:</strong><p th:text="${supplier.name}"></p></div>
      <div class="col-md-6"><strong>Contact Person:</strong><p th:text="${supplier.contactPerson ?: '-'}"></p></div>
      <div class="col-md-6"><strong>Email:</strong><p th:text="${supplier.email ?: '-'}"></p></div>
      <div class="col-md-6"><strong>Phone:</strong><p th:text="${supplier.phone}"></p></div>
      <div class="col-md-6"><strong>City:</strong><p th:text="${supplier.city ?: '-'}"></p></div>
      <div class="col-md-6"><strong>Country:</strong><p th:text="${supplier.country}"></p></div>
      <div class="col-md-6"><strong>Tax Number:</strong><p th:text="${supplier.taxNumber ?: '-'}"></p></div>
      <div class="col-md-6"><strong>Payment Terms:</strong><p th:text="${supplier.paymentTerms ?: '-'}"></p></div>
      <div class="col-12" th:if="${supplier.address}"><strong>Address:</strong><p th:text="${supplier.address}"></p></div>
      <div class="col-12" th:if="${supplier.notes}"><strong>Notes:</strong><p th:text="${supplier.notes}"></p></div>
    </div>
  </div>
</div>
</th:block>
<th:block th:fragment="scripts"></th:block>
</html>
